<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 312" role="img" aria-label="Highly Sensitive Person vs Autism: A Respectful Contrast">
  <defs>
    <linearGradient id="highlysensitivepersonvsautism0en-panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16112c"/><stop offset="1" stop-color="#0b0a1b"/>
    </linearGradient>
    <radialGradient id="highlysensitivepersonvsautism0en-node" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#f6e6bf"/><stop offset="1" stop-color="#cda354"/>
    </radialGradient>
    <filter id="highlysensitivepersonvsautism0en-soft" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <rect x="1.5" y="1.5" width="837" height="309" rx="22" fill="url(#highlysensitivepersonvsautism0en-panel)" stroke="#d4af6a" stroke-opacity="0.28"/>
  <text x="44" y="46" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#efeaf8">Highly Sensitive Person vs Autism: A Respectful Contrast</text>
  <line x1="44" y1="64" x2="796" y2="64" stroke="#d4af6a" stroke-opacity="0.18"/>
    <rect x="44" y="84" width="365.0" height="188" rx="14" fill="#ffffff" fill-opacity="0.035" stroke="#d4af6a" stroke-opacity="0.20"/>
    <rect x="44" y="84" width="365.0" height="4" rx="2" fill="#d4af6a" fill-opacity="0.55"/>
    <text x="60" y="114" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="700" fill="#f3effb">Highly Sensitive Person (trait)</text>
    <circle cx="61" cy="144" r="2.4" fill="#d4af6a"/>
    <text x="70" y="148" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9a93b5">Temperament trait you self-describe; sensory</text>
    <text x="70" y="165" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9a93b5">overwhelm often eases with rest</text>
    <circle cx="61" cy="187" r="2.4" fill="#d4af6a"/>
    <text x="70" y="191" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9a93b5">Social situations are tiring but generally readable</text>
    <rect x="431" y="84" width="365.0" height="188" rx="14" fill="#ffffff" fill-opacity="0.035" stroke="#d4af6a" stroke-opacity="0.20"/>
    <rect x="431" y="84" width="365.0" height="4" rx="2" fill="#d4af6a" fill-opacity="0.55"/>
    <text x="447" y="114" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="700" fill="#f3effb">Autism (clinical condition)</text>
    <circle cx="448" cy="144" r="2.4" fill="#d4af6a"/>
    <text x="457" y="148" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9a93b5">Neurodevelopmental diagnosis only a qualified</text>
    <text x="457" y="165" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9a93b5">professional can assess</text>
    <circle cx="448" cy="187" r="2.4" fill="#d4af6a"/>
    <text x="457" y="191" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9a93b5">Differences in social communication; a deeper need</text>
    <text x="457" y="208" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9a93b5">for predictable routine</text>
  <text x="420" y="290" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#6f6890">A self-reflection framework — tendencies, not predictions.</text>
