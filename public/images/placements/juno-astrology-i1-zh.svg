  <text x="116" y="237.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">硬相位</text>
  <text x="116" y="259.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">刑冥王见控制拉锯，冲月亮见安全与自主</text>
  <circle cx="76" cy="301" r="20.0" fill="url(#junoastrology1zh-glow)" opacity="0.5"/>
