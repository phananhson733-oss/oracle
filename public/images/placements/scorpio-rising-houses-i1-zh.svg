    <circle cx="76" cy="116.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="125.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">1</text>
  <text x="116" y="117.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">确认上升星座</text>
  <text x="116" y="139.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">出生时间要准，半小时就可能换上升</text>
  <circle cx="76" cy="181" r="20.0" fill="url(#scorpiorisinghouses1zh-glow)" opacity="0.5"/>
    <circle cx="76" cy="181" r="15" fill="url(#scorpiorisinghouses1zh-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="176.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="185.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">2</text>
  <text x="116" y="177.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">确认分宫制</text>
  <text x="116" y="199.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">整宫制与等宫制下宫头星座最清晰</text>
  <circle cx="76" cy="241" r="20.0" fill="url(#scorpiorisinghouses1zh-glow)" opacity="0.5"/>
    <circle cx="76" cy="241" r="15" fill="url(#scorpiorisinghouses1zh-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="236.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="245.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">3</text>
  <text x="116" y="237.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">查第七宫宫头</text>
  <text x="116" y="259.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">若是金牛座，金星即主管伴侣宫</text>
  <circle cx="76" cy="301" r="20.0" fill="url(#scorpiorisinghouses1zh-glow)" opacity="0.5"/>
    <circle cx="76" cy="301" r="15" fill="url(#scorpiorisinghouses1zh-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="296.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="305.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">4</text>
  <text x="116" y="297.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">完整定位金星</text>
  <text x="116" y="319.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">星座、宫位、庙旺与相位决定其表现</text>
  <circle cx="76" cy="361" r="20.0" fill="url(#scorpiorisinghouses1zh-glow)" opacity="0.5"/>
    <circle cx="76" cy="361" r="15" fill="url(#scorpiorisinghouses1zh-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="356.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="365.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">5</text>
  <text x="116" y="357.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">查七宫内行星</text>
  <text x="116" y="379.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">宫内行星与金星共同塑造关系模式</text>
  <circle cx="76" cy="421" r="20.0" fill="url(#scorpiorisinghouses1zh-glow)" opacity="0.5"/>
    <circle cx="76" cy="421" r="15" fill="url(#scorpiorisinghouses1zh-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="416.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="425.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">6</text>
  <text x="116" y="417.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">看第十二宫宫头</text>
  <text x="116" y="439.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">若是天秤座，隐秘内在生活也归金星</text>
