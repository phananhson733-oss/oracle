  <text x="116" y="237.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">Vs one all-purpose stone</text>
  <text x="116" y="259.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">Simple, but loses per-center precision</text>
  <circle cx="76" cy="301" r="20.0" fill="url(#crystalsforeachchakra2en-glow)" opacity="0.5"/>
    <circle cx="76" cy="301" r="15" fill="url(#crystalsforeachchakra2en-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
