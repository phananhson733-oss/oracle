<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 312" role="img" aria-label="Two Ends of the Node Axis">
  <defs>
    <linearGradient id="rahumahadasha0en-panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16112c"/><stop offset="1" stop-color="#0b0a1b"/>
    </linearGradient>
    <radialGradient id="rahumahadasha0en-node" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#f6e6bf"/><stop offset="1" stop-color="#cda354"/>
    </radialGradient>
    <filter id="rahumahadasha0en-soft" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <rect x="1.5" y="1.5" width="837" height="309" rx="22" fill="url(#rahumahadasha0en-panel)" stroke="#d4af6a" stroke-opacity="0.28"/>
  <text x="44" y="46" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#efeaf8">Two Ends of the Node Axis</text>
  <line x1="44" y1="64" x2="796" y2="64" stroke="#d4af6a" stroke-opacity="0.18"/>
    <rect x="44" y="84" width="365.0" height="188" rx="14" fill="#ffffff" fill-opacity="0.035" stroke="#d4af6a" stroke-opacity="0.20"/>
    <rect x="44" y="84" width="365.0" height="4" rx="2" fill="#d4af6a" fill-opacity="0.55"/>
    <text x="60" y="114" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="700" fill="#f3effb">Rahu (north node)</text>
    <circle cx="61" cy="144" r="2.4" fill="#d4af6a"/>
    <text x="70" y="148" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9a93b5">Pushes outward: ambition, acquisition, the</text>
    <text x="70" y="165" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9a93b5">unfamiliar</text>
    <circle cx="61" cy="187" r="2.4" fill="#d4af6a"/>
    <text x="70" y="191" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9a93b5">Gains reach and speed, at the cost of grounding</text>
    <rect x="431" y="84" width="365.0" height="188" rx="14" fill="#ffffff" fill-opacity="0.035" stroke="#d4af6a" stroke-opacity="0.20"/>
    <rect x="431" y="84" width="365.0" height="4" rx="2" fill="#d4af6a" fill-opacity="0.55"/>
    <text x="447" y="114" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="700" fill="#f3effb">Ketu (south node)</text>
    <circle cx="448" cy="144" r="2.4" fill="#d4af6a"/>
    <text x="457" y="148" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9a93b5">Pulls inward: detachment, release, inner search</text>
    <circle cx="448" cy="170" r="2.4" fill="#d4af6a"/>
    <text x="457" y="174" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9a93b5">Its 7 years steady you, at the cost of outward drive</text>
  <text x="420" y="290" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#6f6890">A self-reflection framework — tendencies, not predictions.</text>
</svg>
