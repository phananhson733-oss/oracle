<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 312" role="img" aria-label="Three Areas Venus's Period Leans Toward">
  <defs>
    <linearGradient id="venusmahadasha0en-panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16112c"/><stop offset="1" stop-color="#0b0a1b"/>
    </linearGradient>
    <radialGradient id="venusmahadasha0en-node" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#f6e6bf"/><stop offset="1" stop-color="#cda354"/>
    </radialGradient>
    <filter id="venusmahadasha0en-soft" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <rect x="1.5" y="1.5" width="977" height="309" rx="22" fill="url(#venusmahadasha0en-panel)" stroke="#d4af6a" stroke-opacity="0.28"/>
  <text x="44" y="46" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#efeaf8">Three Areas Venus's Period Leans Toward</text>
  <line x1="44" y1="64" x2="936" y2="64" stroke="#d4af6a" stroke-opacity="0.18"/>
    <rect x="44" y="84" width="282.7" height="188" rx="14" fill="#ffffff" fill-opacity="0.035" stroke="#d4af6a" stroke-opacity="0.20"/>
    <rect x="44" y="84" width="282.7" height="4" rx="2" fill="#d4af6a" fill-opacity="0.55"/>
    <text x="60" y="114" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="700" fill="#f3effb">Relationships</text>
    <circle cx="61" cy="144" r="2.4" fill="#d4af6a"/>
    <text x="70" y="148" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9a93b5">Partnership, marriage, renewed</text>
    <text x="70" y="165" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9a93b5">closeness surface</text>
    <circle cx="61" cy="187" r="2.4" fill="#d4af6a"/>
    <text x="70" y="191" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9a93b5">Whether nourishing or strained depends</text>
    <text x="70" y="208" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9a93b5">on Venus's condition</text>
    <rect x="348.6666666666667" y="84" width="282.7" height="188" rx="14" fill="#ffffff" fill-opacity="0.035" stroke="#d4af6a" stroke-opacity="0.20"/>
    <rect x="348.6666666666667" y="84" width="282.7" height="4" rx="2" fill="#d4af6a" fill-opacity="0.55"/>
    <text x="364.6666666666667" y="114" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="700" fill="#f3effb">Finances &amp; material</text>
    <circle cx="365.6666666666667" cy="144" r="2.4" fill="#d4af6a"/>
    <text x="374.6666666666667" y="148" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9a93b5">Gains tied to beauty, art, luxury,</text>
    <text x="374.6666666666667" y="165" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9a93b5">pleasant living</text>
    <circle cx="365.6666666666667" cy="187" r="2.4" fill="#d4af6a"/>
    <text x="374.6666666666667" y="191" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9a93b5">An afflicted Venus can tip toward</text>
    <text x="374.6666666666667" y="208" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9a93b5">overspending instead</text>
    <rect x="653.3333333333334" y="84" width="282.7" height="188" rx="14" fill="#ffffff" fill-opacity="0.035" stroke="#d4af6a" stroke-opacity="0.20"/>
    <rect x="653.3333333333334" y="84" width="282.7" height="4" rx="2" fill="#d4af6a" fill-opacity="0.55"/>
    <text x="669.3333333333334" y="114" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="700" fill="#f3effb">Creativity</text>
    <circle cx="670.3333333333334" cy="144" r="2.4" fill="#d4af6a"/>
    <text x="679.3333333333334" y="148" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9a93b5">Music, design and craft finally get room</text>
    <text x="679.3333333333334" y="165" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9a93b5">to breathe</text>
    <circle cx="670.3333333333334" cy="187" r="2.4" fill="#d4af6a"/>
    <text x="679.3333333333334" y="191" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9a93b5">A lean, not a guarantee — it rewards</text>
    <text x="679.3333333333334" y="208" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9a93b5">attention</text>
  <text x="490" y="290" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#6f6890">A self-reflection framework — tendencies, not predictions.</text>
</svg>
