<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 312" role="img" aria-label="金星大运倾向的三个领域">
  <defs>
    <linearGradient id="venusmahadasha0zh-panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16112c"/><stop offset="1" stop-color="#0b0a1b"/>
    </linearGradient>
    <radialGradient id="venusmahadasha0zh-node" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#f6e6bf"/><stop offset="1" stop-color="#cda354"/>
    </radialGradient>
    <filter id="venusmahadasha0zh-soft" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <rect x="1.5" y="1.5" width="977" height="309" rx="22" fill="url(#venusmahadasha0zh-panel)" stroke="#d4af6a" stroke-opacity="0.28"/>
  <text x="44" y="46" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#efeaf8">金星大运倾向的三个领域</text>
  <line x1="44" y1="64" x2="936" y2="64" stroke="#d4af6a" stroke-opacity="0.18"/>
    <rect x="44" y="84" width="282.7" height="188" rx="14" fill="#ffffff" fill-opacity="0.035" stroke="#d4af6a" stroke-opacity="0.20"/>
    <rect x="44" y="84" width="282.7" height="4" rx="2" fill="#d4af6a" fill-opacity="0.55"/>
    <text x="60" y="114" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="700" fill="#f3effb">关系</text>
    <circle cx="61" cy="144" r="2.4" fill="#d4af6a"/>
    <text x="70" y="148" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9a93b5">伴侣、婚姻、重新靠近浮上来</text>
    <circle cx="61" cy="170" r="2.4" fill="#d4af6a"/>
    <text x="70" y="174" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9a93b5">滋养还是紧张，取决于金星的状态</text>
    <rect x="348.6666666666667" y="84" width="282.7" height="188" rx="14" fill="#ffffff" fill-opacity="0.035" stroke="#d4af6a" stroke-opacity="0.20"/>
    <rect x="348.6666666666667" y="84" width="282.7" height="4" rx="2" fill="#d4af6a" fill-opacity="0.55"/>
    <text x="364.6666666666667" y="114" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="700" fill="#f3effb">财务与物质</text>
    <circle cx="365.6666666666667" cy="144" r="2.4" fill="#d4af6a"/>
    <text x="374.6666666666667" y="148" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9a93b5">与美、艺术、奢享、安适相关的收益</text>
    <circle cx="365.6666666666667" cy="170" r="2.4" fill="#d4af6a"/>
    <text x="374.6666666666667" y="174" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9a93b5">金星受克时反而可能偏向过度消费</text>
    <rect x="653.3333333333334" y="84" width="282.7" height="188" rx="14" fill="#ffffff" fill-opacity="0.035" stroke="#d4af6a" stroke-opacity="0.20"/>
    <rect x="653.3333333333334" y="84" width="282.7" height="4" rx="2" fill="#d4af6a" fill-opacity="0.55"/>
    <text x="669.3333333333334" y="114" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="700" fill="#f3effb">创造</text>
    <circle cx="670.3333333333334" cy="144" r="2.4" fill="#d4af6a"/>
    <text x="679.3333333333334" y="148" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9a93b5">音乐、设计与手艺终于有了空间</text>
    <circle cx="670.3333333333334" cy="170" r="2.4" fill="#d4af6a"/>
    <text x="679.3333333333334" y="174" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9a93b5">是倾向而非承诺——它回报用心的人</text>
  <text x="490" y="290" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#6f6890">自我反思框架，描述倾向而非预测。</text>
</svg>
