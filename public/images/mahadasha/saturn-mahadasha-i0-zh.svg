<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 300" role="img" aria-label="十九年：踏实积累的长弧">
  <defs>
    <linearGradient id="saturnmahadasha0zh-panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16112c"/><stop offset="1" stop-color="#0b0a1b"/>
    </linearGradient>
    <radialGradient id="saturnmahadasha0zh-node" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#f6e6bf"/><stop offset="1" stop-color="#cda354"/>
    </radialGradient>
    <filter id="saturnmahadasha0zh-soft" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <rect x="1.5" y="1.5" width="837" height="297" rx="22" fill="url(#saturnmahadasha0zh-panel)" stroke="#d4af6a" stroke-opacity="0.28"/>
  <text x="44" y="46" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#efeaf8">十九年：踏实积累的长弧</text>
  <line x1="44" y1="64" x2="796" y2="64" stroke="#d4af6a" stroke-opacity="0.18"/>
  <line x1="56" y1="150" x2="784" y2="150" stroke="#d4af6a" stroke-opacity="0.35"/>
  <g text-anchor="middle">
    <text x="177.3" y="120" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-weight="700" fill="#d4af6a">前段</text>
    <circle cx="177.3" cy="150" r="9" fill="url(#saturnmahadasha0zh-node)" filter="url(#saturnmahadasha0zh-soft)" opacity="0.6"/>
    <circle cx="177.3" cy="150" r="6" fill="url(#saturnmahadasha0zh-node)"/>
    <text x="177.3" y="182" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#f3effb">延迟与负重</text>
    <text x="177.3" y="204" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#9a93b5">常表现为责任加重、迟迟卡住，事情慢热难推</text>
    <text x="177.3" y="218" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#9a93b5">。</text>
    <text x="420.0" y="120" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-weight="700" fill="#d4af6a">中段</text>
    <circle cx="420.0" cy="150" r="9" fill="url(#saturnmahadasha0zh-node)" filter="url(#saturnmahadasha0zh-soft)" opacity="0.6"/>
    <circle cx="420.0" cy="150" r="6" fill="url(#saturnmahadasha0zh-node)"/>
    <text x="420.0" y="182" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#f3effb">小运轮转</text>
    <text x="420.0" y="204" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#9a93b5">大运里的小运每隔几年改变体感，并非一成不</text>
    <text x="420.0" y="218" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#9a93b5">变。</text>
    <text x="662.7" y="120" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-weight="700" fill="#d4af6a">后段</text>
    <circle cx="662.7" cy="150" r="9" fill="url(#saturnmahadasha0zh-node)" filter="url(#saturnmahadasha0zh-soft)" opacity="0.6"/>
    <circle cx="662.7" cy="150" r="6" fill="url(#saturnmahadasha0zh-node)"/>
    <text x="662.7" y="182" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#f3effb">结构成形</text>
    <text x="662.7" y="204" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#9a93b5">回报来得晚：靠踏实努力搭起的根基逐渐累积</text>
    <text x="662.7" y="218" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#9a93b5">成形。</text>
  </g>
  <text x="420" y="278" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#6f6890">自我反思框架，描述倾向而非预测。</text>
</svg>
