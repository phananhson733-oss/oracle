    <text x="76" y="245.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">3</text>
  <text x="116" y="237.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">观察事业格局</text>
  <text x="116" y="259.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">角宫太阳使公众成就居于核心，而非边缘</text>
  <circle cx="76" cy="301" r="20.0" fill="url(#carlosalcarazbirthchart1zh-glow)" opacity="0.5"/>
