    <text x="76" y="185.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">2</text>
  <text x="116" y="177.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">把元素读成风格</text>
  <text x="116" y="199.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">火=进攻与灵光，土=结构与耐力，风=传球与战术，水=直觉与流动</text>
  <circle cx="76" cy="241" r="20.0" fill="url(#zodiacsignsasworldcup2026teams0zh-glow)" opacity="0.5"/>
    <circle cx="76" cy="241" r="15" fill="url(#zodiacsignsasworldcup2026teams0zh-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="236.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="245.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">3</text>
  <text x="116" y="237.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">加上你的模态</text>
  <text x="116" y="259.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">基本星座发起进攻，固定星座守住阵型，变动星座中途应变</text>
  <circle cx="76" cy="301" r="20.0" fill="url(#zodiacsignsasworldcup2026teams0zh-glow)" opacity="0.5"/>
    <circle cx="76" cy="301" r="15" fill="url(#zodiacsignsasworldcup2026teams0zh-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="296.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="305.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">4</text>
  <text x="116" y="297.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">对应风格，而非某国</text>
  <text x="116" y="319.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">把自己对应到一种球队风格，而不是给哪个国家做预测</text>
  <circle cx="76" cy="361" r="20.0" fill="url(#zodiacsignsasworldcup2026teams0zh-glow)" opacity="0.5"/>
    <circle cx="76" cy="361" r="15" fill="url(#zodiacsignsasworldcup2026teams0zh-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="356.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="365.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">5</text>
  <text x="116" y="357.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">放轻松</text>
  <text x="116" y="379.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">用星座看世界杯球队是气质的比喻，不是球探报告</text>
