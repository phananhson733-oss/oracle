  <circle cx="76" cy="121" r="20.0" fill="url(#franceengland3rdplacematchastrologyprediction0en-glow)" opacity="0.5"/>
    <circle cx="76" cy="121" r="15" fill="url(#franceengland3rdplacematchastrologyprediction0en-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="116.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="125.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">1</text>
  <text x="116" y="117.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">Check the Moon Sign</text>
  <text x="116" y="139.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">Note the day's Moon sign — it sets the emotional temperature both teams and fans</text>
  <text x="116" y="157.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">bring to the fixture.</text>
  <circle cx="76" cy="199" r="20.0" fill="url(#franceengland3rdplacematchastrologyprediction0en-glow)" opacity="0.5"/>
    <circle cx="76" cy="199" r="15" fill="url(#franceengland3rdplacematchastrologyprediction0en-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="194.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="203.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">2</text>
  <text x="116" y="195.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">Spot Active Planets</text>
  <text x="116" y="217.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">Check which planets are active in France's and England's national charts and</text>
  <text x="116" y="235.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">compare the archetypes they represent.</text>
  <circle cx="76" cy="277" r="20.0" fill="url(#franceengland3rdplacematchastrologyprediction0en-glow)" opacity="0.5"/>
    <circle cx="76" cy="277" r="15" fill="url(#franceengland3rdplacematchastrologyprediction0en-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="272.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="281.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">3</text>
  <text x="116" y="273.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">Scan the Aspects</text>
  <text x="116" y="295.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">Look for tense transits like squares and oppositions hinting at friction, and</text>
  <text x="116" y="313.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">softer trines hinting at flow.</text>
  <circle cx="76" cy="355" r="20.0" fill="url(#franceengland3rdplacematchastrologyprediction0en-glow)" opacity="0.5"/>
    <circle cx="76" cy="355" r="15" fill="url(#franceengland3rdplacematchastrologyprediction0en-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="350.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="359.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">4</text>
  <text x="116" y="351.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">Notice Your Reaction</text>
  <text x="116" y="373.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">Observe your own response to each theme — it is data about you, not evidence</text>
  <text x="116" y="391.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">about the score.</text>
  <circle cx="76" cy="433" r="20.0" fill="url(#franceengland3rdplacematchastrologyprediction0en-glow)" opacity="0.5"/>
    <circle cx="76" cy="433" r="15" fill="url(#franceengland3rdplacematchastrologyprediction0en-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="428.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="437.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">5</text>
  <text x="116" y="429.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">Write It Down</text>
  <text x="116" y="451.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">Record your expected mood so you can compare your read against the real game</text>
  <text x="116" y="469.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">afterward.</text>
