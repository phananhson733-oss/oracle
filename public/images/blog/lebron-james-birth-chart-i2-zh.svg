    <text x="76" y="185.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">2</text>
  <text x="116" y="177.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">将他简化为太阳星座</text>
  <text x="116" y="199.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">完整格局——包括月亮与相位——使任何单一星座概括都显得过于简单</text>
  <circle cx="76" cy="241" r="20.0" fill="url(#lebronjamesbirthchart2zh-glow)" opacity="0.5"/>
