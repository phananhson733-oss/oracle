    <text x="76" y="125.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">1</text>
  <text x="116" y="117.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">将星盘视为成就的证明</text>
  <text x="116" y="139.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">星盘描述的是倾向与主题，而非成就的原因</text>
  <circle cx="76" cy="181" r="20.0" fill="url(#lebronjamesbirthchart2zh-glow)" opacity="0.5"/>
    <circle cx="76" cy="181" r="15" fill="url(#lebronjamesbirthchart2zh-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
