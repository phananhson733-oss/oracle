    <circle cx="76" cy="116.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="125.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">1</text>
  <text x="116" y="117.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">紧迫感被激活</text>
  <text x="116" y="139.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">比赛压力让西班牙变得更紧迫还是更谨慎？紧迫感的激活意味着对冲开始消解。</text>
  <circle cx="76" cy="181" r="20.0" fill="url(#spainworldcup2026astrology0zh-glow)" opacity="0.5"/>
    <circle cx="76" cy="181" r="15" fill="url(#spainworldcup2026astrology0zh-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="176.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="185.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">2</text>
  <text x="116" y="177.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">赢来的控球</text>
  <text x="116" y="199.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">每一脚传递都带着真实意图吗——赢来的而非承袭来的？承袭来的控球在行运压力下显得</text>
  <text x="116" y="217.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">吃力。</text>
  <circle cx="76" cy="259" r="20.0" fill="url(#spainworldcup2026astrology0zh-glow)" opacity="0.5"/>
    <circle cx="76" cy="259" r="15" fill="url(#spainworldcup2026astrology0zh-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="254.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="263.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">3</text>
  <text x="116" y="255.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">终结与纪律并至</text>
  <text x="116" y="277.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">6月15日呈现控球完好、终结缺席。两者同时出现意味着巨蟹-摩羯对冲正在整合。</text>
  <circle cx="76" cy="319" r="20.0" fill="url(#spainworldcup2026astrology0zh-glow)" opacity="0.5"/>
    <circle cx="76" cy="319" r="15" fill="url(#spainworldcup2026astrology0zh-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="314.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="323.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">4</text>
  <text x="116" y="315.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">不照剧本的冒险得到回报</text>
  <text x="116" y="337.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">斗牛士军团选择相信时机的直塞而非受控传递吗？见效的回应式冒险意味着行运进入消</text>
  <text x="116" y="355.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">解阶段。</text>
  <circle cx="76" cy="397" r="20.0" fill="url(#spainworldcup2026astrology0zh-glow)" opacity="0.5"/>
    <circle cx="76" cy="397" r="15" fill="url(#spainworldcup2026astrology0zh-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="392.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="401.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">5</text>
  <text x="116" y="393.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">下半场承载本真能量</text>
  <text x="116" y="415.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">带摩羯座关联的星盘在对冲压力下常打出谨慎的上半场。当必要性再也无法被拒之门外</text>
  <text x="116" y="433.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">时，星盘的真正表达才到来。</text>
