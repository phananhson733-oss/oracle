    <circle cx="76" cy="181" r="15" fill="url(#zodiacsignsasworldcup2026teams0en-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="176.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="185.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">2</text>
  <text x="116" y="177.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">Read the Element</text>
  <text x="116" y="199.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">Fire = attack and flair; earth = structure and stamina; air = passing and</text>
  <text x="116" y="217.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">tactics; water = intuition and flow</text>
  <circle cx="76" cy="259" r="20.0" fill="url(#zodiacsignsasworldcup2026teams0en-glow)" opacity="0.5"/>
    <circle cx="76" cy="259" r="15" fill="url(#zodiacsignsasworldcup2026teams0en-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="254.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="263.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">3</text>
  <text x="116" y="255.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">Add Your Modality</text>
  <text x="116" y="277.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">Cardinal signs start moves, fixed signs hold shape, mutable signs adapt</text>
  <text x="116" y="295.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">mid-play</text>
  <circle cx="76" cy="337" r="20.0" fill="url(#zodiacsignsasworldcup2026teams0en-glow)" opacity="0.5"/>
    <circle cx="76" cy="337" r="15" fill="url(#zodiacsignsasworldcup2026teams0en-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="332.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="341.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">4</text>
  <text x="116" y="333.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">Match a Style</text>
  <text x="116" y="355.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">Map yourself to a style of team rather than a forecast for any nation</text>
  <circle cx="76" cy="397" r="20.0" fill="url(#zodiacsignsasworldcup2026teams0en-glow)" opacity="0.5"/>
    <circle cx="76" cy="397" r="15" fill="url(#zodiacsignsasworldcup2026teams0en-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="392.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="401.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">5</text>
  <text x="116" y="393.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">Keep It Light</text>
  <text x="116" y="415.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">This is a metaphor for temperament, not a scouting report</text>
