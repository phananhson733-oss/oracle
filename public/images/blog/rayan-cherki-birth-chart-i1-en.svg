    <text x="76" y="125.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">1</text>
  <text x="116" y="117.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">Start with what is public</text>
  <text x="116" y="139.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">Note Sun in Leo as reported from mid-August 2003 birth — reported, not</text>
  <text x="116" y="157.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">confirmed</text>
  <circle cx="76" cy="199" r="20.0" fill="url(#rayancherkibirthchart1en-glow)" opacity="0.5"/>
    <circle cx="76" cy="199" r="15" fill="url(#rayancherkibirthchart1en-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="194.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="203.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">2</text>
  <text x="116" y="195.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">Flag the missing birth time</text>
  <text x="116" y="217.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">Without a verified time, Moon and rising sign are guesses — say so out loud</text>
  <circle cx="76" cy="259" r="20.0" fill="url(#rayancherkibirthchart1en-glow)" opacity="0.5"/>
    <circle cx="76" cy="259" r="15" fill="url(#rayancherkibirthchart1en-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="254.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="263.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">3</text>
  <text x="116" y="255.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">Read the Sun as image, not outcome</text>
  <text x="116" y="277.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">Leo Sun suggests visible confidence and spotlight flair, not a scoreline</text>
  <circle cx="76" cy="319" r="20.0" fill="url(#rayancherkibirthchart1en-glow)" opacity="0.5"/>
    <circle cx="76" cy="319" r="15" fill="url(#rayancherkibirthchart1en-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="314.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="323.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">4</text>
  <text x="116" y="315.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">Separate aspects from ambition</text>
  <text x="116" y="337.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">A dynamic square points to friction or drive as a theme, not a transfer or</text>
  <text x="116" y="355.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">trophy</text>
  <circle cx="76" cy="397" r="20.0" fill="url(#rayancherkibirthchart1en-glow)" opacity="0.5"/>
    <circle cx="76" cy="397" r="15" fill="url(#rayancherkibirthchart1en-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="392.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="401.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">5</text>
  <text x="116" y="393.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">Name your source of certainty</text>
  <text x="116" y="415.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">Downgrade any fact resting on an unverified birth time to a maybe</text>
