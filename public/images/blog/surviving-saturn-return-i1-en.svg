    <circle cx="76" cy="199" r="15" fill="url(#survivingsaturnreturn1en-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="194.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="203.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">2</text>
  <text x="116" y="195.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">Chart Area Pressure</text>
  <text x="116" y="217.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">The house Saturn occupies natally concentrates the review on that life area</text>
  <circle cx="76" cy="259" r="20.0" fill="url(#survivingsaturnreturn1en-glow)" opacity="0.5"/>
    <circle cx="76" cy="259" r="15" fill="url(#survivingsaturnreturn1en-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="254.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="263.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">3</text>
  <text x="116" y="255.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">Is-This-Mine Questions</text>
  <text x="116" y="277.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">Commitments that once felt automatic now demand a conscious yes or no</text>
  <circle cx="76" cy="319" r="20.0" fill="url(#survivingsaturnreturn1en-glow)" opacity="0.5"/>
    <circle cx="76" cy="319" r="15" fill="url(#survivingsaturnreturn1en-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="314.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="323.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">4</text>
  <text x="116" y="315.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">Consequences Catching Up</text>
  <text x="116" y="337.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">Shortcuts taken in your twenties present a specific, nameable bill</text>
  <circle cx="76" cy="379" r="20.0" fill="url(#survivingsaturnreturn1en-glow)" opacity="0.5"/>
    <circle cx="76" cy="379" r="15" fill="url(#survivingsaturnreturn1en-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="374.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="383.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">5</text>
  <text x="116" y="375.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">Pull Toward Structure</text>
  <text x="116" y="397.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">An unexpected wish for clear rules, contracts, and long-term plans</text>
