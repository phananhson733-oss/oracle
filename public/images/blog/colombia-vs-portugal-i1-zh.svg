  <text x="116" y="177.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">将当日星象覆盖两队</text>
  <text x="116" y="199.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">巨蟹座木星塑造共同氛围——情感张力、归属感与保护性主场强度</text>
  <circle cx="76" cy="241" r="20.0" fill="url(#colombiavsportugal1zh-glow)" opacity="0.5"/>
    <circle cx="76" cy="241" r="15" fill="url(#colombiavsportugal1zh-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="236.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="245.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">3</text>
  <text x="116" y="237.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">将球员视为活的象征</text>
  <text x="116" y="259.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">将迪亚斯的直接与罗纳尔多的告别弧线视为本命主题——驱动力、遗产、时机——而非数据</text>
  <circle cx="76" cy="301" r="20.0" fill="url(#colombiavsportugal1zh-glow)" opacity="0.5"/>
    <circle cx="76" cy="301" r="15" fill="url(#colombiavsportugal1zh-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="296.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="305.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">4</text>
  <text x="116" y="297.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">关注叙事弧线</text>
  <text x="116" y="319.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">思考这个夜晚服务于哪个故事：崛起的挑战者，还是正在封章的老将</text>
