  <text x="116" y="177.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">标出缺失的部分</text>
  <text x="116" y="199.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">无核验出生时间，月亮、上升与宫位不可考</text>
  <circle cx="76" cy="241" r="20.0" fill="url(#harrykanebirthchart0zh-glow)" opacity="0.5"/>
