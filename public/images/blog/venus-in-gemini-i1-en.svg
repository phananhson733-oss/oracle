    <circle cx="76" cy="116.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="125.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">1</text>
  <text x="116" y="117.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">Words as Courtship</text>
  <text x="116" y="139.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">Long threads, inside jokes, and clever banter matter more than grand gestures</text>
  <circle cx="76" cy="181" r="20.0" fill="url(#venusingemini1en-glow)" opacity="0.5"/>
    <circle cx="76" cy="181" r="15" fill="url(#venusingemini1en-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="176.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="185.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">2</text>
  <text x="116" y="177.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">Attraction to Range</text>
  <text x="116" y="199.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">Interest sparks around people with varied skills, opinions, or something new to</text>
  <text x="116" y="217.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">teach</text>
  <circle cx="76" cy="259" r="20.0" fill="url(#venusingemini1en-glow)" opacity="0.5"/>
    <circle cx="76" cy="259" r="15" fill="url(#venusingemini1en-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="254.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="263.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">3</text>
  <text x="116" y="255.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">Restless with Monotony</text>
  <text x="116" y="277.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">Repetition and heavy routine drain the spark faster than open disagreement</text>
  <circle cx="76" cy="319" r="20.0" fill="url(#venusingemini1en-glow)" opacity="0.5"/>
    <circle cx="76" cy="319" r="15" fill="url(#venusingemini1en-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="314.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="323.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">4</text>
  <text x="116" y="315.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">Light Social Flirtation</text>
  <text x="116" y="337.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">Charm is quick and playful; looks like interest in everyone because of</text>
  <text x="116" y="355.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">curiosity about everyone</text>
  <circle cx="76" cy="397" r="20.0" fill="url(#venusingemini1en-glow)" opacity="0.5"/>
    <circle cx="76" cy="397" r="15" fill="url(#venusingemini1en-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="392.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="401.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">5</text>
  <text x="116" y="393.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">Loving Through Debate</text>
  <text x="116" y="415.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">Being met intellectually and allowed to change one's mind lands as a form of</text>
  <text x="116" y="433.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">being loved</text>
  <circle cx="76" cy="475" r="20.0" fill="url(#venusingemini1en-glow)" opacity="0.5"/>
    <circle cx="76" cy="475" r="15" fill="url(#venusingemini1en-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="470.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="479.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">6</text>
  <text x="116" y="471.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">Quick Warmth, Slow Anchoring</text>
  <text x="116" y="493.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">Rapport arrives fast, but deep security usually needs time and steadier</text>
  <text x="116" y="511.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">placements to build</text>
