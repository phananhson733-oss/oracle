    <text x="76" y="305.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">4</text>
  <text x="116" y="297.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">注意火星宫位</text>
  <text x="116" y="319.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">回归星盘中火星所在宫位指明本周期的人生领域</text>
  <circle cx="76" cy="361" r="20.0" fill="url(#marsreturnastrology1zh-glow)" opacity="0.5"/>
    <circle cx="76" cy="361" r="15" fill="url(#marsreturnastrology1zh-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="356.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="365.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">5</text>
  <text x="116" y="357.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">解读火星相位</text>
  <text x="116" y="379.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">柔和相位助力前行；强硬相位预示潜在阻力或冲突</text>
  <circle cx="76" cy="421" r="20.0" fill="url(#marsreturnastrology1zh-glow)" opacity="0.5"/>
    <circle cx="76" cy="421" r="15" fill="url(#marsreturnastrology1zh-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="416.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="425.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">6</text>
  <text x="116" y="417.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">用作规划提示</text>
  <text x="116" y="439.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">将解读作为未来两年的规划提示，下次回归时回顾验证</text>
