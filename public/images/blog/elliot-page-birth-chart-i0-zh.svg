    <text x="76" y="125.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">1</text>
  <text x="116" y="117.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">从日月组合开始</text>
  <text x="116" y="139.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">揭示公开形象与内心需求之间的张力</text>
  <circle cx="76" cy="181" r="20.0" fill="url(#elliotpagebirthchart0zh-glow)" opacity="0.5"/>
    <circle cx="76" cy="181" r="15" fill="url(#elliotpagebirthchart0zh-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="176.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="185.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">2</text>
  <text x="116" y="177.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">找出最强星群</text>
  <text x="116" y="199.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">三颗或更多行星的合相标志着星盘的重心所在</text>
  <circle cx="76" cy="241" r="20.0" fill="url(#elliotpagebirthchart0zh-glow)" opacity="0.5"/>
    <circle cx="76" cy="241" r="15" fill="url(#elliotpagebirthchart0zh-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
