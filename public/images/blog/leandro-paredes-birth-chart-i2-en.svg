  <text x="84" y="508.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#a59cc0">Without a verified birth time, any ascendant claim is guesswork and should</text>
  <text x="84" y="527.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#a59cc0">be labeled as such</text>
