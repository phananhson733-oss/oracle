  <text x="84" y="460.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#a59cc0">Scorpio emphasis signals intensity and loyalty, not villainy or a character</text>
  <text x="84" y="479.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#a59cc0">flaw</text>
