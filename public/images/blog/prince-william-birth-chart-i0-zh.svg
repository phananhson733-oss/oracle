  <text x="84" y="422.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#a59cc0">需要安全感、归属感与私密空间才能良好运作</text>
  <path d="M 70 442.8 L 70.5 445.5 L 73.2 446 L 70.5 446.5 L 70 449.2 L 69.5 446.5 L 66.8 446 L 69.5 445.5 Z" fill="#d4af6a" opacity="0.8"/>
  <text x="84" y="451.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#a59cc0">在内部处理情绪，并保护所处理的一切</text>
  <path d="M 70 471.8 L 70.5 474.5 L 73.2 475 L 70.5 475.5 L 70 478.2 L 69.5 475.5 L 66.8 475 L 69.5 474.5 Z" fill="#d4af6a" opacity="0.8"/>
  <text x="84" y="480.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#a59cc0">情感自给自足——并非不可接触</text>
