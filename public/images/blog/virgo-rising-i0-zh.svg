    <text x="76" y="185.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">2</text>
  <text x="116" y="177.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">找到水星位置</text>
  <text x="116" y="199.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">查找水星所在的星座和宫位——这一位置会影响整体表达方式</text>
  <circle cx="76" cy="241" r="20.0" fill="url(#virgorising0zh-glow)" opacity="0.5"/>
