  <text x="116" y="237.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">留意第六宫主题</text>
  <text x="116" y="259.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">日常规律、健康、工作与服务在日常生活中具有举足轻重的地位</text>
  <circle cx="76" cy="301" r="20.0" fill="url(#virgorising0zh-glow)" opacity="0.5"/>
