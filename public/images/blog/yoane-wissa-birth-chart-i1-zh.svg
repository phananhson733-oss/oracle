  <text x="132" y="118.0" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="700" letter-spacing="0.4" fill="#f6e6bf">第一步</text>
  <text x="132" y="141.0" font-family="Georgia, 'Times New Roman', serif" font-size="20.5" fill="#f3effb">锚定经核验的事实</text>
  <text x="132" y="164.0" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#a59cc0">1996 年 9 月 3 日生于法国埃皮奈-苏-塞纳尔，把太阳固定在约处女座 11</text>
  <text x="132" y="181.0" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#a59cc0">度——这是唯一一个仅凭出生日期就能钉死的定位</text>
  <circle cx="92" cy="212" r="13.0" fill="url(#yoanewissabirthchart1zh-glow)" opacity="0.5"/>
    <circle cx="92" cy="212" r="8" fill="url(#yoanewissabirthchart1zh-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="92" cy="209.8" r="4.8" fill="#ffffff" opacity="0.10"/>
    <path d="M 92 208.0 L 92.6 211.4 L 96.0 212 L 92.6 212.6 L 92 216.0 L 91.4 212.6 L 88.0 212 L 91.4 211.4 Z" fill="#3a2c12" opacity="0.85"/>
  <text x="132" y="217.0" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="700" letter-spacing="0.4" fill="#f6e6bf">第二步</text>
  <text x="132" y="240.0" font-family="Georgia, 'Times New Roman', serif" font-size="20.5" fill="#f3effb">把未知大声标出来</text>
  <text x="132" y="263.0" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#a59cc0">出生时间未公开，月亮星座、上升与宫位都无从核验——把它们留作开放，绝不用猜测填补空</text>
  <text x="132" y="280.0" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#a59cc0">白</text>
  <circle cx="92" cy="311" r="13.0" fill="url(#yoanewissabirthchart1zh-glow)" opacity="0.5"/>
    <circle cx="92" cy="311" r="8" fill="url(#yoanewissabirthchart1zh-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="92" cy="308.8" r="4.8" fill="#ffffff" opacity="0.10"/>
    <path d="M 92 307.0 L 92.6 310.4 L 96.0 311 L 92.6 311.6 L 92 315.0 L 91.4 311.6 L 88.0 311 L 91.4 310.4 Z" fill="#3a2c12" opacity="0.85"/>
  <text x="132" y="316.0" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="700" letter-spacing="0.4" fill="#f6e6bf">第三步</text>
  <text x="132" y="339.0" font-family="Georgia, 'Times New Roman', serif" font-size="20.5" fill="#f3effb">把处女座弧线读作逐步精通</text>
  <text x="132" y="362.0" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#a59cc0">水星守护的适应力、变动土象的精准，以技艺与服务铺就的游历式成长路——生于法国、代表</text>
  <text x="132" y="379.0" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#a59cc0">刚果民主共和国、从布伦特福德辗转纽卡斯尔</text>
  <circle cx="92" cy="410" r="13.0" fill="url(#yoanewissabirthchart1zh-glow)" opacity="0.5"/>
    <circle cx="92" cy="410" r="8" fill="url(#yoanewissabirthchart1zh-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="92" cy="407.8" r="4.8" fill="#ffffff" opacity="0.10"/>
    <path d="M 92 406.0 L 92.6 409.4 L 96.0 410 L 92.6 410.6 L 92 414.0 L 91.4 410.6 L 88.0 410 L 91.4 409.4 Z" fill="#3a2c12" opacity="0.85"/>
  <text x="132" y="415.0" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="700" letter-spacing="0.4" fill="#f6e6bf">第四步</text>
  <text x="132" y="438.0" font-family="Georgia, 'Times New Roman', serif" font-size="20.5" fill="#f3effb">把历史性事实背景握成象征语境</text>
  <text x="132" y="461.0" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#a59cc0">刚果民主共和国取得 2026</text>
  <text x="132" y="478.0" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#a59cc0">世界杯资格——史上第二次参赛——是经核实的事实，非预言；处女座太阳那种耐心积累的主…</text>
