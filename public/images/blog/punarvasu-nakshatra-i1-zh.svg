  <text x="116" y="297.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">观察归来模式</text>
  <text x="116" y="319.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">观察过去挫折是否转化为成长而非停滞</text>
  <circle cx="76" cy="361" r="20.0" fill="url(#punarvasunakshatra1zh-glow)" opacity="0.5"/>
