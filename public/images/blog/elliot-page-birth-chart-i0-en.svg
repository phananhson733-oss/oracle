  <circle cx="76" cy="121" r="20.0" fill="url(#elliotpagebirthchart0en-glow)" opacity="0.5"/>
    <circle cx="76" cy="121" r="15" fill="url(#elliotpagebirthchart0en-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="116.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="125.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">1</text>
  <text x="116" y="117.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">Start with the Sun–Moon Pair</text>
  <text x="116" y="139.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">Shows the pull between how someone shines publicly and what they quietly need</text>
  <circle cx="76" cy="181" r="20.0" fill="url(#elliotpagebirthchart0en-glow)" opacity="0.5"/>
    <circle cx="76" cy="181" r="15" fill="url(#elliotpagebirthchart0en-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="176.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="185.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">2</text>
  <text x="116" y="177.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">Find the Loudest Cluster</text>
  <text x="116" y="199.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">A stellium of three or more planets marks the chart's center of gravity</text>
  <circle cx="76" cy="241" r="20.0" fill="url(#elliotpagebirthchart0en-glow)" opacity="0.5"/>
    <circle cx="76" cy="241" r="15" fill="url(#elliotpagebirthchart0en-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="236.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="245.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">3</text>
  <text x="116" y="237.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">Read the Angles</text>
  <text x="116" y="259.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">Rising sign and its ruler describe the public entrance and first impression</text>
  <circle cx="76" cy="301" r="20.0" fill="url(#elliotpagebirthchart0en-glow)" opacity="0.5"/>
    <circle cx="76" cy="301" r="15" fill="url(#elliotpagebirthchart0en-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="296.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="305.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">4</text>
  <text x="116" y="297.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">Trace One Major Aspect</text>
  <text x="116" y="319.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">A tight square or opposition names the core friction better than a long list of</text>
  <text x="116" y="337.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">signs</text>
  <circle cx="76" cy="379" r="20.0" fill="url(#elliotpagebirthchart0en-glow)" opacity="0.5"/>
    <circle cx="76" cy="379" r="15" fill="url(#elliotpagebirthchart0en-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="374.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="383.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">5</text>
  <text x="116" y="375.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">Name the Theme, Then Stop</text>
  <text x="116" y="397.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">Sum the pattern in one honest sentence and resist turning it into a claim about</text>
  <text x="116" y="415.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">private life</text>
  <path d="M 202.22749999999988 440.4 L 202.6 442.6 L 204.8 443 L 202.6 443.4 L 202.22749999999988 445.6 L 201.8 443.4 L 199.6 443 L 201.8 442.6 Z" fill="#d4af6a" opacity="0.5"/>
  <text x="380" y="447" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="11.5" fill="#7b738f">A self-reflection framework — tendencies, not predictions</text>
