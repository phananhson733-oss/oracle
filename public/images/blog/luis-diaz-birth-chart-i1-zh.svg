    <path d="M 92 191.0 L 92.6 194.4 L 96.0 195 L 92.6 195.6 L 92 199.0 L 91.4 195.6 L 88.0 195 L 91.4 194.4 Z" fill="#3a2c12" opacity="0.85"/>
  <text x="132" y="200.0" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="700" letter-spacing="0.4" fill="#f6e6bf">第二步</text>
  <text x="132" y="223.0" font-family="Georgia, 'Times New Roman', serif" font-size="20.5" fill="#f3effb">把未知出生时间大声标出来</text>
  <text x="132" y="246.0" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#a59cc0">出生时间未公开，月亮、上升与宫位都无从核验——绝不编造填补</text>
  <circle cx="92" cy="277" r="13.0" fill="url(#luisdiazbirthchart1zh-glow)" opacity="0.5"/>
    <circle cx="92" cy="277" r="8" fill="url(#luisdiazbirthchart1zh-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="92" cy="274.8" r="4.8" fill="#ffffff" opacity="0.10"/>
    <path d="M 92 273.0 L 92.6 276.4 L 96.0 277 L 92.6 277.6 L 92 281.0 L 91.4 277.6 L 88.0 277 L 91.4 276.4 Z" fill="#3a2c12" opacity="0.85"/>
  <text x="132" y="282.0" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="700" letter-spacing="0.4" fill="#f6e6bf">第三步</text>
  <text x="132" y="305.0" font-family="Georgia, 'Times New Roman', serif" font-size="20.5" fill="#f3effb">把摩羯弧线读成纪律攀升</text>
  <text x="132" y="328.0" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#a59cc0">结构性耐力、从边缘出发缓慢攀升至顶级机构——是发展主题，不是性格判词</text>
  <circle cx="92" cy="359" r="13.0" fill="url(#luisdiazbirthchart1zh-glow)" opacity="0.5"/>
    <circle cx="92" cy="359" r="8" fill="url(#luisdiazbirthchart1zh-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="92" cy="356.8" r="4.8" fill="#ffffff" opacity="0.10"/>
    <path d="M 92 355.0 L 92.6 358.4 L 96.0 359 L 92.6 359.6 L 92 363.0 L 91.4 359.6 L 88.0 359 L 91.4 358.4 Z" fill="#3a2c12" opacity="0.85"/>
  <text x="132" y="364.0" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="700" letter-spacing="0.4" fill="#f6e6bf">第四步</text>
  <text x="132" y="387.0" font-family="Georgia, 'Times New Roman', serif" font-size="20.5" fill="#f3effb">将土星在白羊座握成象征背景</text>
  <text x="132" y="410.0" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#a59cc0">土星 2025–2028</text>
  <text x="132" y="427.0" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#a59cc0">年行经白羊座，四分本命摩羯座——多年问责弧线，仅读作象征主题，从不用作比赛判决</text>
  <path d="M 280.025 447.4 L 280.4 449.6 L 282.6 450 L 280.4 450.4 L 280.025 452.6 L 279.6 450.4 L 277.4 450 L 279.6 449.6 Z" fill="#d4af6a" opacity="0.5"/>
  <text x="380" y="454" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="11.5" fill="#7b738f">自我反思框架，描述倾向而非预测</text>
