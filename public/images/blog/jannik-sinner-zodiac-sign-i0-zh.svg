  <circle cx="76" cy="121" r="20.0" fill="url(#janniksinnerzodiacsign0zh-glow)" opacity="0.5"/>
    <circle cx="76" cy="121" r="15" fill="url(#janniksinnerzodiacsign0zh-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="116.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="125.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">1</text>
  <text x="116" y="117.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">找到太阳所在的星座和宫位</text>
  <text x="116" y="139.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">找出狮子座中的太阳，再看它所在的宫位，判断聚光灯倾向于落在哪里</text>
  <circle cx="76" cy="181" r="20.0" fill="url(#janniksinnerzodiacsign0zh-glow)" opacity="0.5"/>
    <circle cx="76" cy="181" r="15" fill="url(#janniksinnerzodiacsign0zh-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="176.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="185.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">2</text>
  <text x="116" y="177.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">查看上升星座</text>
  <text x="116" y="199.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">狮子座太阳与更内敛的上升星座搭配，可解释粉丝注意到的「沉默刺客」反差</text>
  <circle cx="76" cy="241" r="20.0" fill="url(#janniksinnerzodiacsign0zh-glow)" opacity="0.5"/>
    <circle cx="76" cy="241" r="15" fill="url(#janniksinnerzodiacsign0zh-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="236.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="245.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">3</text>
  <text x="116" y="237.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">观察固定星座的行为特质</text>
  <text x="116" y="259.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">在压力下坚守同一战术，一分接一分，这是固定火象星座耐力的典型表现</text>
  <circle cx="76" cy="301" r="20.0" fill="url(#janniksinnerzodiacsign0zh-glow)" opacity="0.5"/>
    <circle cx="76" cy="301" r="15" fill="url(#janniksinnerzodiacsign0zh-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="296.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="305.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">4</text>
  <text x="116" y="297.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">区分人格面具与星座星位</text>
  <text x="116" y="319.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">分辨「狮子座意味着戏剧化」是借来的刻板印象，还是你真正能观察到的规律</text>
  <circle cx="76" cy="361" r="20.0" fill="url(#janniksinnerzodiacsign0zh-glow)" opacity="0.5"/>
    <circle cx="76" cy="361" r="15" fill="url(#janniksinnerzodiacsign0zh-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="356.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="365.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">5</text>
  <text x="116" y="357.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">与其他狮子座运动员对比</text>
  <text x="116" y="379.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">对比多张星盘，可以看出哪些特质真正属于狮子座，哪些只是个人风格</text>
