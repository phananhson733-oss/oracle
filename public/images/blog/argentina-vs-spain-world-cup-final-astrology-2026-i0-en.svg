  <text x="116" y="237.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">Compare the contact points</text>
  <text x="116" y="259.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">The sharper the contrast between the two, the stronger the symbolic story</text>
  <circle cx="76" cy="301" r="20.0" fill="url(#argentinavsspainworldcupfinalastrology20260en-glow)" opacity="0.5"/>
    <circle cx="76" cy="301" r="15" fill="url(#argentinavsspainworldcupfinalastrology20260en-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
