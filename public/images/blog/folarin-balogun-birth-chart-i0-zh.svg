  <circle cx="76" cy="121" r="20.0" fill="url(#folarinbalogunbirthchart0zh-glow)" opacity="0.5"/>
    <circle cx="76" cy="121" r="15" fill="url(#folarinbalogunbirthchart0zh-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="116.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="125.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">1</text>
  <text x="116" y="117.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">从已确认的太阳开始</text>
  <text x="116" y="139.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">7月3日确认巨蟹座太阳——身份认同、忠诚、记忆与保护是最可靠的解读基础</text>
  <circle cx="76" cy="181" r="20.0" fill="url(#folarinbalogunbirthchart0zh-glow)" opacity="0.5"/>
    <circle cx="76" cy="181" r="15" fill="url(#folarinbalogunbirthchart0zh-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="176.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="185.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">2</text>
  <text x="116" y="177.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">不要猜测上升星座</text>
  <text x="116" y="199.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">没有确认的出生时间，上升星座与宫位应保持开放，不做猜测</text>
  <circle cx="76" cy="241" r="20.0" fill="url(#folarinbalogunbirthchart0zh-glow)" opacity="0.5"/>
    <circle cx="76" cy="241" r="15" fill="url(#folarinbalogunbirthchart0zh-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="236.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="245.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">3</text>
  <text x="116" y="237.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">关注国籍选择的故事</text>
  <text x="116" y="259.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">他选择美国队是最公开的案例，展示了归属感比外部显而易见的标签更重要</text>
  <circle cx="76" cy="301" r="20.0" fill="url(#folarinbalogunbirthchart0zh-glow)" opacity="0.5"/>
    <circle cx="76" cy="301" r="15" fill="url(#folarinbalogunbirthchart0zh-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="296.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="305.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">4</text>
  <text x="116" y="297.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">将强度解读为保护性</text>
  <text x="116" y="319.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">场上的锋芒可解读为捍卫团队角色，而非单纯追求个人荣耀</text>
  <circle cx="76" cy="361" r="20.0" fill="url(#folarinbalogunbirthchart0zh-glow)" opacity="0.5"/>
    <circle cx="76" cy="361" r="15" fill="url(#folarinbalogunbirthchart0zh-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="356.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="365.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">5</text>
  <text x="116" y="357.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">单独比较时间因素</text>
  <text x="116" y="379.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">行运描述压力时期，但不应取代本命巨蟹座太阳的基础解读</text>
