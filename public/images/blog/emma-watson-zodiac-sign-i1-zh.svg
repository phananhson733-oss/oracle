    <text x="76" y="125.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">1</text>
  <text x="116" y="117.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">冷静的第一印象</text>
  <text x="116" y="139.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">处女座上升首先呈现为从容与精准，即便内在白羊座动力十分强烈。</text>
  <circle cx="76" cy="181" r="20.0" fill="url(#emmawatsonzodiacsign1zh-glow)" opacity="0.5"/>
    <circle cx="76" cy="181" r="15" fill="url(#emmawatsonzodiacsign1zh-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="176.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="185.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">2</text>
  <text x="116" y="177.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">压力下显现的信念</text>
  <text x="116" y="199.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">白羊座能量体现在立场与坚持上，而非音量——关注她的承诺与坚守。</text>
  <circle cx="76" cy="241" r="20.0" fill="url(#emmawatsonzodiacsign1zh-glow)" opacity="0.5"/>
    <circle cx="76" cy="241" r="15" fill="url(#emmawatsonzodiacsign1zh-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="236.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="245.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">3</text>
  <text x="116" y="237.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">细节是关键信号</text>
  <text x="116" y="259.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">处女座上升倾向于准确与谨慎措辞，而非即兴反应。</text>
  <circle cx="76" cy="301" r="20.0" fill="url(#emmawatsonzodiacsign1zh-glow)" opacity="0.5"/>
    <circle cx="76" cy="301" r="15" fill="url(#emmawatsonzodiacsign1zh-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="296.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="305.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">4</text>
  <text x="116" y="297.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">社会议题指向月亮</text>
  <text x="116" y="319.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">射手座月亮体现为对全球议题、教育与意义的持续吸引。</text>
  <circle cx="76" cy="361" r="20.0" fill="url(#emmawatsonzodiacsign1zh-glow)" opacity="0.5"/>
    <circle cx="76" cy="361" r="15" fill="url(#emmawatsonzodiacsign1zh-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="356.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="365.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">5</text>
  <text x="116" y="357.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">克制而非缺席</text>
  <text x="116" y="379.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">此处的冷静是被驾驭的驱动力，正是仅读太阳星座时容易忽略的部分。</text>
