    <circle cx="92" cy="311" r="8" fill="url(#howlongdoessaturnreturnlast1en-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="92" cy="308.8" r="4.8" fill="#ffffff" opacity="0.10"/>
    <path d="M 92 307.0 L 92.6 310.4 L 96.0 311 L 92.6 311.6 L 92 315.0 L 91.4 311.6 L 88.0 311 L 91.4 310.4 Z" fill="#3a2c12" opacity="0.85"/>
  <text x="132" y="316.0" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="700" letter-spacing="0.4" fill="#f6e6bf">Phase 3</text>
  <text x="132" y="339.0" font-family="Georgia, 'Times New Roman', serif" font-size="20.5" fill="#f3effb">Retrograde Re-Crossings</text>
  <text x="132" y="362.0" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#a59cc0">Saturn can back over the degree up to three times, stretching the felt window</text>
  <circle cx="92" cy="393" r="13.0" fill="url(#howlongdoessaturnreturnlast1en-glow)" opacity="0.5"/>
    <circle cx="92" cy="393" r="8" fill="url(#howlongdoessaturnreturnlast1en-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="92" cy="390.8" r="4.8" fill="#ffffff" opacity="0.10"/>
    <path d="M 92 389.0 L 92.6 392.4 L 96.0 393 L 92.6 393.6 L 92 397.0 L 91.4 393.6 L 88.0 393 L 91.4 392.4 Z" fill="#3a2c12" opacity="0.85"/>
  <text x="132" y="398.0" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="700" letter-spacing="0.4" fill="#f6e6bf">Phase 4</text>
  <text x="132" y="421.0" font-family="Georgia, 'Times New Roman', serif" font-size="20.5" fill="#f3effb">Separation</text>
  <text x="132" y="444.0" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#a59cc0">Saturn pulls past the natal degree for good and the pressure eases into</text>
  <text x="132" y="461.0" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#a59cc0">integration</text>
