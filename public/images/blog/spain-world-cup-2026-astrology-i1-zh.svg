  <text x="116" y="297.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">接受即兴冒险</text>
  <text x="116" y="319.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">红衣军团是否敢于发出巨蟹座式即兴直塞球，而非依赖管控式传球</text>
