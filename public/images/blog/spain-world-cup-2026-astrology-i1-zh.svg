  <text x="116" y="237.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">把握机会的紧迫感出现</text>
  <text x="116" y="259.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">控球与把握机会的紧迫感是否同时出现，标志巨蟹-摩羯刑位整合</text>
