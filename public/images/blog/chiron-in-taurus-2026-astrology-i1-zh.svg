  <text x="116" y="117.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">标记日期</text>
  <text x="116" y="139.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">2026年6月19日入座；9月17日退回牡羊座；2027年4月回归；2034年5月结束</text>
  <circle cx="76" cy="181" r="20.0" fill="url(#chironintaurus2026astrology1zh-glow)" opacity="0.5"/>
