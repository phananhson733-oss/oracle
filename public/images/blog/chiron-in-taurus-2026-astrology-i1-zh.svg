    <text x="76" y="185.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">2</text>
  <text x="116" y="177.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">找到金牛座宫位</text>
  <text x="116" y="199.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">在本命盘中找到容纳金牛座的宫位，它指明主题将聚焦的生活领域</text>
  <circle cx="76" cy="241" r="20.0" fill="url(#chironintaurus2026astrology1zh-glow)" opacity="0.5"/>
    <circle cx="76" cy="241" r="15" fill="url(#chironintaurus2026astrology1zh-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="236.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="245.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">3</text>
  <text x="116" y="237.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">留意早度数行星</text>
  <text x="116" y="259.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">识别落在金牛座早度数的本命行星，它们在2026年首次经过时率先被激活</text>
  <circle cx="76" cy="301" r="20.0" fill="url(#chironintaurus2026astrology1zh-glow)" opacity="0.5"/>
    <circle cx="76" cy="301" r="15" fill="url(#chironintaurus2026astrology1zh-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="296.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="305.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">4</text>
  <text x="116" y="297.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">把2026年视为预演</text>
  <text x="116" y="319.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">六至九月窗口是与主题的初次接触，而非完整篇章</text>
  <circle cx="76" cy="361" r="20.0" fill="url(#chironintaurus2026astrology1zh-glow)" opacity="0.5"/>
    <circle cx="76" cy="361" r="15" fill="url(#chironintaurus2026astrology1zh-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="356.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="365.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">5</text>
  <text x="116" y="357.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">理解逆行含义</text>
  <text x="116" y="379.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">退回牡羊座是对身份认同课题的有意重访，而非倒退或进展受阻</text>
  <circle cx="76" cy="421" r="20.0" fill="url(#chironintaurus2026astrology1zh-glow)" opacity="0.5"/>
    <circle cx="76" cy="421" r="15" fill="url(#chironintaurus2026astrology1zh-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="416.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="425.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">6</text>
  <text x="116" y="417.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">持守长期弧线</text>
  <text x="116" y="439.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">随凯龙星行经金牛座，跨越数年回望主题，观察真正发生了什么位移</text>
