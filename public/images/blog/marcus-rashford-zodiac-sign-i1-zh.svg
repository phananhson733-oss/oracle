    <text x="76" y="125.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">1</text>
  <text x="116" y="117.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">平静表面，强劲暗流</text>
  <text x="116" y="139.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">沉稳的公众形象掩盖了远超表面的深度</text>
  <circle cx="76" cy="181" r="20.0" fill="url(#marcusrashfordzodiacsign1zh-glow)" opacity="0.5"/>
    <circle cx="76" cy="181" r="15" fill="url(#marcusrashfordzodiacsign1zh-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="176.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="185.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">2</text>
  <text x="116" y="177.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">选择性的全情投入</text>
  <text x="116" y="199.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">精力全情投入少数人或事业，对其余事物刻意保持私密</text>
  <circle cx="76" cy="241" r="20.0" fill="url(#marcusrashfordzodiacsign1zh-glow)" opacity="0.5"/>
    <circle cx="76" cy="241" r="15" fill="url(#marcusrashfordzodiacsign1zh-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="236.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="245.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">3</text>
  <text x="116" y="237.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">情感内化，而非外显</text>
  <text x="116" y="259.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">强烈情感在内心消化；表面冷静实为压制在内的强度</text>
  <circle cx="76" cy="301" r="20.0" fill="url(#marcusrashfordzodiacsign1zh-glow)" opacity="0.5"/>
    <circle cx="76" cy="301" r="15" fill="url(#marcusrashfordzodiacsign1zh-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="296.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="305.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">4</text>
  <text x="116" y="297.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">原则性的例外发声</text>
  <text x="116" y="319.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">射手座火星在真正信服的事业上爆发——谨慎让位于直接的坦诚</text>
  <circle cx="76" cy="361" r="20.0" fill="url(#marcusrashfordzodiacsign1zh-glow)" opacity="0.5"/>
    <circle cx="76" cy="361" r="15" fill="url(#marcusrashfordzodiacsign1zh-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="356.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="365.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">5</text>
  <text x="116" y="357.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">声誉意识过滤器</text>
  <text x="116" y="379.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">摩羯座上升（如果存在）使公众行为保持纪律性和形象意识</text>
