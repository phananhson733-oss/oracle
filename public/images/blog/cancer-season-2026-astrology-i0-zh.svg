  <text x="116" y="277.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">水星在巨蟹座逆行（6月29日至7月23日）使旧话题重浮；太阳四分白羊座土星（约7月6</text>
