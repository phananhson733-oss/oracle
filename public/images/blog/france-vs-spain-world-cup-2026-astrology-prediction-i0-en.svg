    <text x="76" y="203.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">2</text>
  <text x="116" y="195.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">Layer in the 2026 Transit</text>
  <text x="116" y="217.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">Jupiter in Gemini colors the whole tournament with speed, wit, and quick</text>
  <text x="116" y="235.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">exchanges — shared weather over both benches, not a result lever</text>
  <circle cx="76" cy="277" r="20.0" fill="url(#francevsspainworldcup2026astrologyprediction0en-glow)" opacity="0.5"/>
    <circle cx="76" cy="277" r="15" fill="url(#francevsspainworldcup2026astrologyprediction0en-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
