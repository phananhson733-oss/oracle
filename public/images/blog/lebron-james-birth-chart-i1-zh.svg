  <text x="116" y="117.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">找出最强主题</text>
  <text x="116" y="139.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">寻找集中于同一星座或区域的多颗行星，那里是故事的核心所在</text>
  <circle cx="76" cy="181" r="20.0" fill="url(#lebronjamesbirthchart1zh-glow)" opacity="0.5"/>
    <circle cx="76" cy="181" r="15" fill="url(#lebronjamesbirthchart1zh-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="176.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="185.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">2</text>
  <text x="116" y="177.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">将太阳视为主线骨架</text>
  <text x="116" y="199.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">摩羯座太阳指向雄心与结构，是其他配置围绕装饰的核心主线</text>
  <circle cx="76" cy="241" r="20.0" fill="url(#lebronjamesbirthchart1zh-glow)" opacity="0.5"/>
    <circle cx="76" cy="241" r="15" fill="url(#lebronjamesbirthchart1zh-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="236.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="245.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">3</text>
  <text x="116" y="237.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">追踪内在张力</text>
  <text x="116" y="259.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">注意两颗行星间最尖锐的相位角，这种内在张力往往体现为公众可见的矛盾</text>
  <circle cx="76" cy="301" r="20.0" fill="url(#lebronjamesbirthchart1zh-glow)" opacity="0.5"/>
    <circle cx="76" cy="301" r="15" fill="url(#lebronjamesbirthchart1zh-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="296.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="305.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">4</text>
  <text x="116" y="297.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">权衡四元素比重</text>
  <text x="116" y="319.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">统计土、水、火、风四种元素的数量，优势元素暗示一个人在压力下的行事倾向</text>
  <circle cx="76" cy="361" r="20.0" fill="url(#lebronjamesbirthchart1zh-glow)" opacity="0.5"/>
    <circle cx="76" cy="361" r="15" fill="url(#lebronjamesbirthchart1zh-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="356.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="365.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">5</text>
  <text x="116" y="357.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">灵活看待宫位</text>
  <text x="116" y="379.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">宫位含义显示能量在哪里运作，但这高度依赖于准确的出生时间</text>
