    <text x="76" y="152.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">1</text>
  <text x="116" y="144.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">Contrast the national chart tones</text>
  <text x="116" y="166.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">Read Spain's archetypes against France's — expressive versus structured — as</text>
  <text x="116" y="184.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">two characters, not two scorecards</text>
  <circle cx="76" cy="226" r="20.0" fill="url(#spainvsfranceworldcup2026astrology0en-glow)" opacity="0.5"/>
    <circle cx="76" cy="226" r="15" fill="url(#spainvsfranceworldcup2026astrology0en-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="221.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="230.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">2</text>
  <text x="116" y="222.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">Spot a dominant element</text>
  <text x="116" y="244.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">Look for stacked fire, earth, air, or water in key player charts and treat it as</text>
  <text x="116" y="262.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">a style cue rather than a rating</text>
  <circle cx="76" cy="304" r="20.0" fill="url(#spainvsfranceworldcup2026astrology0en-glow)" opacity="0.5"/>
    <circle cx="76" cy="304" r="15" fill="url(#spainvsfranceworldcup2026astrology0en-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="299.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="308.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">3</text>
  <text x="116" y="300.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">Track the Jupiter-in-Gemini motif</text>
  <text x="116" y="322.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">Notice themes of quickness, exchange, and youth that the 2026 transit tends to</text>
  <text x="116" y="340.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">amplify across the whole tournament</text>
  <circle cx="76" cy="382" r="20.0" fill="url(#spainvsfranceworldcup2026astrology0en-glow)" opacity="0.5"/>
    <circle cx="76" cy="382" r="15" fill="url(#spainvsfranceworldcup2026astrology0en-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="377.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="386.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">4</text>
  <text x="116" y="378.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">Watch the timing, not the winner</text>
  <text x="116" y="400.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">Read transits as mood over a match window, and never as a locked-in result</text>
  <circle cx="76" cy="442" r="20.0" fill="url(#spainvsfranceworldcup2026astrology0en-glow)" opacity="0.5"/>
    <circle cx="76" cy="442" r="15" fill="url(#spainvsfranceworldcup2026astrology0en-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="437.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="446.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">5</text>
  <text x="116" y="438.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">Name what you're projecting</text>
  <text x="116" y="460.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">Catch the moment you start rooting for a symbol, then ask whether that's the</text>
  <text x="116" y="478.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">chart talking or you</text>
