  <text x="132" y="398.0" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="700" letter-spacing="0.4" fill="#f6e6bf">第四步</text>
  <text x="132" y="421.0" font-family="Georgia, 'Times New Roman', serif" font-size="20.5" fill="#f3effb">把白羊土星握作集体性背景</text>
  <text x="132" y="444.0" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#a59cc0">土星 2025–2028</text>
  <text x="132" y="461.0" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#a59cc0">年行经白羊座：一片为所有人共享的广阔结构性背景，而非某位球员的私人标记——把这一…</text>
