  <text x="132" y="299.0" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="700" letter-spacing="0.4" fill="#f6e6bf">第三步</text>
  <text x="132" y="322.0" font-family="Georgia, 'Times New Roman', serif" font-size="20.5" fill="#f3effb">把处女座弧读作精确与适应力</text>
  <text x="132" y="345.0" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#a59cc0">处女座是水星守护的变动土象星座：其象征对应工艺与跨边锋、攻击型中场、前锋的位置适</text>
  <text x="132" y="362.0" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#a59cc0">应力——是主题，不是命运</text>
  <circle cx="92" cy="393" r="13.0" fill="url(#christianpulisicbirthchart1zh-glow)" opacity="0.5"/>
    <circle cx="92" cy="393" r="8" fill="url(#christianpulisicbirthchart1zh-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
