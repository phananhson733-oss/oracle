  <text x="132" y="217.0" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="700" letter-spacing="0.4" fill="#f6e6bf">第二步</text>
  <text x="132" y="240.0" font-family="Georgia, 'Times New Roman', serif" font-size="20.5" fill="#f3effb">标出未知的出生时间</text>
  <text x="132" y="263.0" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#a59cc0">出生时间未见公开，月亮星座、上升与宫位均无从核验——坦诚标出，而非用猜测填补空白</text>
  <circle cx="92" cy="294" r="13.0" fill="url(#christianpulisicbirthchart1zh-glow)" opacity="0.5"/>
    <circle cx="92" cy="294" r="8" fill="url(#christianpulisicbirthchart1zh-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
