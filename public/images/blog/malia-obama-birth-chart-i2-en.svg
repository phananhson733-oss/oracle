  <path d="M 70 326.8 L 70.5 329.5 L 73.2 330 L 70.5 330.5 L 70 333.2 L 69.5 330.5 L 66.8 330 L 69.5 329.5 Z" fill="#d4af6a" opacity="0.8"/>
  <text x="84" y="335.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#a59cc0">Without a confirmed birth time only the Sun sign is reliable — everything</text>
  <text x="84" y="354.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#a59cc0">time-based is provisional</text>
  <path d="M 70 374.8 L 70.5 377.5 L 73.2 378 L 70.5 378.5 L 70 381.2 L 69.5 378.5 L 66.8 378 L 69.5 377.5 Z" fill="#d4af6a" opacity="0.8"/>
  <text x="84" y="383.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#a59cc0">A placement describes a tendency, not a destiny, and can express in many</text>
  <text x="84" y="402.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#a59cc0">directions</text>
