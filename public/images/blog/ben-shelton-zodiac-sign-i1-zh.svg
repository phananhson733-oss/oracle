  <text x="116" y="117.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">天秤座太阳（2002年10月9日）</text>
  <text x="116" y="139.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">将核心身份锚定于平衡与沉着；金星主宰的风元素，带有第七宫的关系主题</text>
