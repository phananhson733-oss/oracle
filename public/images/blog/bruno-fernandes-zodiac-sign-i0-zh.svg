  <circle cx="76" cy="121" r="20.0" fill="url(#brunofernandeszodiacsign0zh-glow)" opacity="0.5"/>
    <circle cx="76" cy="121" r="15" fill="url(#brunofernandeszodiacsign0zh-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="116.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="125.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">1</text>
  <text x="116" y="117.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">针对技术失误的沮丧</text>
  <text x="116" y="139.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">最强烈的反应来自技术失误（如松懈触球、时机不对的跑位），而非个人冒犯</text>
  <circle cx="76" cy="181" r="20.0" fill="url(#brunofernandeszodiacsign0zh-glow)" opacity="0.5"/>
    <circle cx="76" cy="181" r="15" fill="url(#brunofernandeszodiacsign0zh-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="176.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="185.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">2</text>
  <text x="116" y="177.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">即时自我纠正</text>
  <text x="116" y="199.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">在自己传球失误后，批判目光迅速转向自身，常举手承认错误</text>
  <circle cx="76" cy="241" r="20.0" fill="url(#brunofernandeszodiacsign0zh-glow)" opacity="0.5"/>
    <circle cx="76" cy="241" r="15" fill="url(#brunofernandeszodiacsign0zh-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="236.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="245.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">3</text>
  <text x="116" y="237.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">哨声后的外交风度</text>
  <text x="116" y="259.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">赛后天秤座月亮主导，措辞公正平和，与比赛中的激烈形成鲜明对比</text>
  <circle cx="76" cy="301" r="20.0" fill="url(#brunofernandeszodiacsign0zh-glow)" opacity="0.5"/>
    <circle cx="76" cy="301" r="15" fill="url(#brunofernandeszodiacsign0zh-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="296.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="305.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">4</text>
  <text x="116" y="297.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">保护性竞争动力</text>
  <text x="116" y="319.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">巨蟹座火星将竞争驱动力导向保护队友、守护团队，而非追求个人荣耀</text>
  <circle cx="76" cy="361" r="20.0" fill="url(#brunofernandeszodiacsign0zh-glow)" opacity="0.5"/>
    <circle cx="76" cy="361" r="15" fill="url(#brunofernandeszodiacsign0zh-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="356.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="365.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">5</text>
  <text x="116" y="357.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">大声表达标准</text>
  <text x="116" y="379.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">他会直接说出团队本应怎么做——处女座通过技艺服务的本能以领导力而非自我膨胀的方</text>
  <text x="116" y="397.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">式呈现</text>
  <path d="M 280.025 422.4 L 280.4 424.6 L 282.6 425 L 280.4 425.4 L 280.025 427.6 L 279.6 425.4 L 277.4 425 L 279.6 424.6 Z" fill="#d4af6a" opacity="0.5"/>
  <text x="380" y="429" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="11.5" fill="#7b738f">自我反思框架，描述倾向而非预测</text>
  <path d="M 479.975 422.4 L 480.4 424.6 L 482.6 425 L 480.4 425.4 L 479.975 427.6 L 479.6 425.4 L 477.4 425 L 479.6 424.6 Z" fill="#d4af6a" opacity="0.5"/>
