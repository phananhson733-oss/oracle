    <text x="76" y="125.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">1</text>
  <text x="116" y="117.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">确认日期</text>
  <text x="116" y="139.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">以公开报道的出生日期为起点，标注不一致之处，不以猜测填补空白</text>
  <circle cx="76" cy="181" r="20.0" fill="url(#bensheltonzodiacsign0zh-glow)" opacity="0.5"/>
    <circle cx="76" cy="181" r="15" fill="url(#bensheltonzodiacsign0zh-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="176.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="185.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">2</text>
  <text x="116" y="177.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">区分太阳星座</text>
  <text x="116" y="199.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">将太阳星座视为一章，再追问月亮与上升星座带来何种补充或矛盾</text>
  <circle cx="76" cy="241" r="20.0" fill="url(#bensheltonzodiacsign0zh-glow)" opacity="0.5"/>
    <circle cx="76" cy="241" r="15" fill="url(#bensheltonzodiacsign0zh-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="236.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="245.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">3</text>
  <text x="116" y="237.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">寻找聚星与紧密相位</text>
  <text x="116" y="259.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">某星座中的行星聚集或紧密相位，往往比太阳单独更能揭示外显性格</text>
  <circle cx="76" cy="301" r="20.0" fill="url(#bensheltonzodiacsign0zh-glow)" opacity="0.5"/>
    <circle cx="76" cy="301" r="15" fill="url(#bensheltonzodiacsign0zh-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="296.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="305.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">4</text>
  <text x="116" y="297.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">对照可观察行为</text>
  <text x="116" y="319.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">将星盘配置与赛场及采访中有据可查的行为对照，若无对应则保持宽松解读</text>
  <circle cx="76" cy="361" r="20.0" fill="url(#bensheltonzodiacsign0zh-glow)" opacity="0.5"/>
    <circle cx="76" cy="361" r="15" fill="url(#bensheltonzodiacsign0zh-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="356.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="365.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">5</text>
  <text x="116" y="357.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">解读倾向而非结果</text>
  <text x="116" y="379.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">将每个配置理解为在特定条件下可能显现的倾向，而非命中注定的结果</text>
