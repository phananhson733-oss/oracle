  <circle cx="76" cy="121" r="20.0" fill="url(#bukayosakazodiacsign1zh-glow)" opacity="0.5"/>
    <circle cx="76" cy="121" r="15" fill="url(#bukayosakazodiacsign1zh-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="116.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="125.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">1</text>
  <text x="116" y="117.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">回传而非猛射</text>
  <text x="116" y="139.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">突破后选择精准回传而非猛射——处女座精确性优先于蛮力</text>
  <circle cx="76" cy="181" r="20.0" fill="url(#bukayosakazodiacsign1zh-glow)" opacity="0.5"/>
    <circle cx="76" cy="181" r="15" fill="url(#bukayosakazodiacsign1zh-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="176.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="185.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">2</text>
  <text x="116" y="177.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">失误后立刻要球</text>
  <text x="116" y="199.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">丢球数秒内重新索球——白羊座月亮的即时复原反应</text>
  <circle cx="76" cy="241" r="20.0" fill="url(#bukayosakazodiacsign1zh-glow)" opacity="0.5"/>
    <circle cx="76" cy="241" r="15" fill="url(#bukayosakazodiacsign1zh-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="236.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="245.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">3</text>
  <text x="116" y="237.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">宽角度射门</text>
  <text x="116" y="259.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">在他人选择回传时发动远射或刁钻角度射门——射手座火星的体现</text>
  <circle cx="76" cy="301" r="20.0" fill="url(#bukayosakazodiacsign1zh-glow)" opacity="0.5"/>
    <circle cx="76" cy="301" r="15" fill="url(#bukayosakazodiacsign1zh-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="296.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="305.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">4</text>
  <text x="116" y="297.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">疲劳中的冷静重复</text>
  <text x="116" y="319.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">比赛末段在同一路线干净利落地重复相同动作——技艺优先于即兴发挥</text>
  <circle cx="76" cy="361" r="20.0" fill="url(#bukayosakazodiacsign1zh-glow)" opacity="0.5"/>
    <circle cx="76" cy="361" r="15" fill="url(#bukayosakazodiacsign1zh-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="356.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="365.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">5</text>
  <text x="116" y="357.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">战斗性的第一步</text>
  <text x="116" y="379.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">加速呈现为进攻性而非炫技——月亮之火发动，而非太阳之火</text>
