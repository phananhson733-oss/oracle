    <circle cx="76" cy="121" r="15" fill="url(#saturninaries20260zh-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="116.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="125.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">1</text>
  <text x="116" y="117.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">找到你的白羊座宫位</text>
  <text x="116" y="139.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">在本命盘中找到白羊座所在宫位，该领域将承受2026至2028年的土星结构压力</text>
  <circle cx="76" cy="181" r="20.0" fill="url(#saturninaries20260zh-glow)" opacity="0.5"/>
    <circle cx="76" cy="181" r="15" fill="url(#saturninaries20260zh-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="176.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="185.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">2</text>
  <text x="116" y="177.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">读宫位，不读标题</text>
  <text x="116" y="199.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">第十宫代表事业与公众形象，第七宫代表伴侣关系——宫位领域决定所需的结构</text>
  <circle cx="76" cy="241" r="20.0" fill="url(#saturninaries20260zh-glow)" opacity="0.5"/>
    <circle cx="76" cy="241" r="15" fill="url(#saturninaries20260zh-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="236.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="245.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">3</text>
  <text x="116" y="237.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">确认是否叠加土星回归</text>
  <text x="116" y="259.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">先确认本命土星星座——只有本命土星在白羊座的人才会同时经历土星回归</text>
  <circle cx="76" cy="301" r="20.0" fill="url(#saturninaries20260zh-glow)" opacity="0.5"/>
    <circle cx="76" cy="301" r="15" fill="url(#saturninaries20260zh-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="296.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="305.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">4</text>
  <text x="116" y="297.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">观察逆行节奏</text>
  <text x="116" y="319.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">土星于2025年预览白羊座后退回双鱼座，2026年2月再次入驻——将早期感受视为预演</text>
  <circle cx="76" cy="361" r="20.0" fill="url(#saturninaries20260zh-glow)" opacity="0.5"/>
    <circle cx="76" cy="361" r="15" fill="url(#saturninaries20260zh-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="356.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="365.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">5</text>
  <text x="116" y="357.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">将压力转化为建设行动</text>
  <text x="116" y="379.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">在该宫位命名一件具体要建立的事——土星奖励有意识的努力而非冲动行事</text>
