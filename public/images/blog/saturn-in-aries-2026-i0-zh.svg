  <text x="380" y="46" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.4" fill="#efeaf8">五步标记土星行经白羊</text>
  <line x1="230" y1="67" x2="368" y2="67" stroke="url(#saturninaries20260zh-rule)" stroke-width="1"/>
  <line x1="392" y1="67" x2="530" y2="67" stroke="url(#saturninaries20260zh-rule)" stroke-width="1"/>
  <path d="M 380 62.0 L 380.8 66.2 L 385.0 67 L 380.8 67.8 L 380 72.0 L 379.2 67.8 L 375.0 67 L 379.2 66.2 Z" fill="#d4af6a" opacity="0.85"/>
  <line x1="76" y1="121" x2="76" y2="433" stroke="#d4af6a" stroke-opacity="0.28" stroke-width="1.5"/>
  <circle cx="76" cy="121" r="20.0" fill="url(#saturninaries20260zh-glow)" opacity="0.5"/>
    <circle cx="76" cy="121" r="15" fill="url(#saturninaries20260zh-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="116.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="125.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">1</text>
  <text x="116" y="117.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">找到你的白羊宫位</text>
  <text x="116" y="139.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">在本命盘里定位白羊所主管的宫位，那片人生领域就是 2026 至 2028</text>
  <text x="116" y="157.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">年土星结构性要求最集中的地方。</text>
  <circle cx="76" cy="199" r="20.0" fill="url(#saturninaries20260zh-glow)" opacity="0.5"/>
    <circle cx="76" cy="199" r="15" fill="url(#saturninaries20260zh-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="194.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="203.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">2</text>
  <text x="116" y="195.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">读宫位，别读标题</text>
  <text x="116" y="217.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">白羊落第十宫，要求的是事业与公共角色；落第七宫，要求的是伴侣关系与一对一的长</text>
  <text x="116" y="235.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">期投入。</text>
  <circle cx="76" cy="277" r="20.0" fill="url(#saturninaries20260zh-glow)" opacity="0.5"/>
    <circle cx="76" cy="277" r="15" fill="url(#saturninaries20260zh-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="272.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="281.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">3</text>
  <text x="116" y="273.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">确认是否同时是土星回归</text>
  <text x="116" y="295.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">只有出生时土星就落在白羊的人才会同时叠加一次回归，先核对本命土星星座，别想当</text>
  <text x="116" y="313.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">然。</text>
  <circle cx="76" cy="355" r="20.0" fill="url(#saturninaries20260zh-glow)" opacity="0.5"/>
    <circle cx="76" cy="355" r="15" fill="url(#saturninaries20260zh-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="350.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="359.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">4</text>
  <text x="116" y="351.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">留意逆行的形状</text>
  <text x="116" y="373.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">土星 2025 年进入、退回双鱼、再到 2026</text>
  <text x="116" y="391.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">年重新进入，意味着主题会预演、暂停、再续上——把早期那一口当彩排，不是期末考。</text>
  <circle cx="76" cy="433" r="20.0" fill="url(#saturninaries20260zh-glow)" opacity="0.5"/>
    <circle cx="76" cy="433" r="15" fill="url(#saturninaries20260zh-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="428.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="437.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">5</text>
  <text x="116" y="429.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">把压力翻译成搭建</text>
  <text x="116" y="451.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">土星的标志性问题是「这里缺了什么结构」，给那个宫位点名一件具体要去建造的东西</text>
  <text x="116" y="469.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">，而不是绷紧了等着失去什么。</text>
  <path d="M 280.025 494.4 L 280.4 496.6 L 282.6 497 L 280.4 497.4 L 280.025 499.6 L 279.6 497.4 L 277.4 497 L 279.6 496.6 Z" fill="#d4af6a" opacity="0.5"/>
  <text x="380" y="501" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="11.5" fill="#7b738f">自我反思框架，描述倾向而非预测</text>
  <path d="M 479.975 494.4 L 480.4 496.6 L 482.6 497 L 480.4 497.4 L 479.975 499.6 L 479.6 497.4 L 477.4 497 L 479.6 496.6 Z" fill="#d4af6a" opacity="0.5"/>
</svg>
