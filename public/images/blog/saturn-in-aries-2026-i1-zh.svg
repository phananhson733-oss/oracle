  <text x="116" y="117.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">「这次过境就是我的土星回归」</text>
  <text x="116" y="139.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">仅对本命土星在白羊座的人成立——其他人只是普通的宫位过境，并非29年里程碑</text>
  <circle cx="76" cy="181" r="20.0" fill="url(#saturninaries20261zh-glow)" opacity="0.5"/>
    <circle cx="76" cy="181" r="15" fill="url(#saturninaries20261zh-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
