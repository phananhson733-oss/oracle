    <text x="76" y="185.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">2</text>
  <text x="116" y="177.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">「牧羊座土星对白羊座人不利」</text>
  <text x="116" y="199.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">白羊座太阳的人感受第一宫版本，但这是对行动力的结构性压力，而非惩罚</text>
  <circle cx="76" cy="241" r="20.0" fill="url(#saturninaries20261zh-glow)" opacity="0.5"/>
    <circle cx="76" cy="241" r="15" fill="url(#saturninaries20261zh-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="236.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="245.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">3</text>
  <text x="116" y="237.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">「整个时期都是漫长磨难」</text>
  <text x="116" y="259.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">土星经历逆行和顺行阶段，压力有高峰期起伏，而非持续平压直至2028年4月</text>
  <circle cx="76" cy="301" r="20.0" fill="url(#saturninaries20261zh-glow)" opacity="0.5"/>
    <circle cx="76" cy="301" r="15" fill="url(#saturninaries20261zh-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="296.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="305.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">4</text>
  <text x="116" y="297.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">「自己的星盘需要特殊解读」</text>
  <text x="116" y="319.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">方法对所有人都相同——找到白羊座宫位，解读其领域，问缺少什么结构</text>
