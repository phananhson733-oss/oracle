    <text x="76" y="185.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">2</text>
  <text x="116" y="177.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">Moon in Libra</text>
  <text x="116" y="199.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">Seeks emotional balance and fairness; discomfort with open conflict</text>
  <circle cx="76" cy="241" r="20.0" fill="url(#alexanderzverevbirthchart2en-glow)" opacity="0.5"/>
    <circle cx="76" cy="241" r="15" fill="url(#alexanderzverevbirthchart2en-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="236.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="245.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">3</text>
  <text x="116" y="237.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">Mercury in Taurus (retrograde)</text>
  <text x="116" y="259.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">Slows and internalises thinking; measured, deliberate replies rather than</text>
  <text x="116" y="277.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">quick reactions</text>
  <circle cx="76" cy="319" r="20.0" fill="url(#alexanderzverevbirthchart2en-glow)" opacity="0.5"/>
    <circle cx="76" cy="319" r="15" fill="url(#alexanderzverevbirthchart2en-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="314.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="323.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">4</text>
  <text x="116" y="315.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">Mars in Virgo (retrograde)</text>
  <text x="116" y="337.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">Turns drive into precision and self-correction; detail-focused effort</text>
  <circle cx="76" cy="379" r="20.0" fill="url(#alexanderzverevbirthchart2en-glow)" opacity="0.5"/>
    <circle cx="76" cy="379" r="15" fill="url(#alexanderzverevbirthchart2en-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="374.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="383.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">5</text>
  <text x="116" y="375.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">Jupiter in Aquarius</text>
  <text x="116" y="397.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">Expands through independence and big-picture thinking; streak of</text>
  <text x="116" y="415.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">individualism in goals</text>
