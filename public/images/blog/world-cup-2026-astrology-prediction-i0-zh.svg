  <text x="116" y="375.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">提出活的时机问题</text>
  <text x="116" y="397.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">把每个窗口当成一个活的问题：这张星盘此刻被点亮了吗？而不是一个已定的结果</text>
