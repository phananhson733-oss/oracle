  <text x="380" y="326.0" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="21" font-weight="700" letter-spacing="0.3" fill="#f3effb">What the Chart Actually Shows</text>
  <path d="M 70 355.8 L 70.5 358.5 L 73.2 359 L 70.5 359.5 L 70 362.2 L 69.5 359.5 L 66.8 359 L 69.5 358.5 Z" fill="#d4af6a" opacity="0.8"/>
  <text x="84" y="364.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#a59cc0">Earth-sign Virgo perfectionist — flashpoints come from precision falling</text>
  <text x="84" y="383.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#a59cc0">short, not a short fuse</text>
  <path d="M 70 403.8 L 70.5 406.5 L 73.2 407 L 70.5 407.5 L 70 410.2 L 69.5 407.5 L 66.8 407 L 69.5 406.5 Z" fill="#d4af6a" opacity="0.8"/>
  <text x="84" y="412.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#a59cc0">Rising is packaging; the Virgo Sun is the operator, exacting rather than</text>
  <text x="84" y="431.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#a59cc0">explosive</text>
  <path d="M 70 451.8 L 70.5 454.5 L 73.2 455 L 70.5 455.5 L 70 458.2 L 69.5 455.5 L 66.8 455 L 69.5 454.5 Z" fill="#d4af6a" opacity="0.8"/>
  <text x="84" y="460.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#a59cc0">Libra Moon handles the public side; Virgo Sun drives in-game quality</text>
  <text x="84" y="479.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#a59cc0">control — both can be true at once</text>
  <path d="M 70 499.8 L 70.5 502.5 L 73.2 503 L 70.5 503.5 L 70 506.2 L 69.5 503.5 L 66.8 503 L 69.5 502.5 Z" fill="#d4af6a" opacity="0.8"/>
  <text x="84" y="508.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#a59cc0">Holding teammates to a high consistent standard is Virgo's way of serving</text>
  <text x="84" y="527.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#a59cc0">the group, not undermining it</text>
