  <path d="M 47.75 108.6 L 48.3 111.5 L 51.1 112 L 48.3 112.5 L 47.75 115.4 L 47.2 112.5 L 44.4 112 L 47.2 111.5 Z" fill="#f6e6bf" opacity="0.7"/>
  <text x="380" y="128.0" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="21" font-weight="700" letter-spacing="0.3" fill="#f3effb">Common Misread</text>
  <path d="M 70 157.8 L 70.5 160.5 L 73.2 161 L 70.5 161.5 L 70 164.2 L 69.5 161.5 L 66.8 161 L 69.5 160.5 Z" fill="#d4af6a" opacity="0.8"/>
  <text x="84" y="166.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#a59cc0">It happens to every Aries.</text>
  <path d="M 70 186.8 L 70.5 189.5 L 73.2 190 L 70.5 190.5 L 70 193.2 L 69.5 190.5 L 66.8 190 L 69.5 189.5 Z" fill="#d4af6a" opacity="0.8"/>
  <text x="84" y="195.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#a59cc0">It is one continuous crisis from 2025 to 2028.</text>
  <path d="M 70 215.8 L 70.5 218.5 L 73.2 219 L 70.5 219.5 L 70 222.2 L 69.5 219.5 L 66.8 219 L 69.5 218.5 Z" fill="#d4af6a" opacity="0.8"/>
  <text x="84" y="224.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#a59cc0">It predicts a fixed outcome you cannot change.</text>
  <path d="M 70 244.8 L 70.5 247.5 L 73.2 248 L 70.5 248.5 L 70 251.2 L 69.5 248.5 L 66.8 248 L 69.5 247.5 Z" fill="#d4af6a" opacity="0.8"/>
  <text x="84" y="253.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#a59cc0">You only need your birth date.</text>
  <path d="M 380 279.5 L 380.7 283.3 L 384.5 284 L 380.7 284.7 L 380 288.5 L 379.3 284.7 L 375.5 284 L 379.3 283.3 Z" fill="#d4af6a" opacity="0.65"/>
  <rect x="46" y="297" width="668" height="248.0" rx="14" fill="#1d1740" fill-opacity="0.5" stroke="#d4af6a" stroke-opacity="0.22" stroke-width="0.9"/>
  <rect x="46" y="297" width="3.5" height="248.0" rx="1.8" fill="#d4af6a" fill-opacity="0.6"/>
  <path d="M 47.75 306.6 L 48.3 309.5 L 51.1 310 L 48.3 310.5 L 47.75 313.4 L 47.2 310.5 L 44.4 310 L 47.2 309.5 Z" fill="#f6e6bf" opacity="0.7"/>
  <text x="380" y="326.0" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="21" font-weight="700" letter-spacing="0.3" fill="#f3effb">Accurate Reading</text>
  <path d="M 70 355.8 L 70.5 358.5 L 73.2 359 L 70.5 359.5 L 70 362.2 L 69.5 359.5 L 66.8 359 L 69.5 358.5 Z" fill="#d4af6a" opacity="0.8"/>
  <text x="84" y="364.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#a59cc0">It only applies to charts with natal Saturn in Aries — a far smaller group</text>
  <text x="84" y="383.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#a59cc0">than every Aries sun sign.</text>
  <path d="M 70 403.8 L 70.5 406.5 L 73.2 407 L 70.5 407.5 L 70 410.2 L 69.5 407.5 L 66.8 407 L 69.5 406.5 Z" fill="#d4af6a" opacity="0.8"/>
  <text x="84" y="412.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#a59cc0">The passage moves in three acts, with a quiet Pisces retreat sitting in the</text>
  <text x="84" y="431.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#a59cc0">middle.</text>
  <path d="M 70 451.8 L 70.5 454.5 L 73.2 455 L 70.5 455.5 L 70 458.2 L 69.5 455.5 L 66.8 455 L 69.5 454.5 Z" fill="#d4af6a" opacity="0.8"/>
  <text x="84" y="460.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#a59cc0">It describes a review you actively take part in, not a verdict handed down to</text>
  <text x="84" y="479.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#a59cc0">you.</text>
  <path d="M 70 499.8 L 70.5 502.5 L 73.2 503 L 70.5 503.5 L 70 506.2 L 69.5 503.5 L 66.8 503 L 69.5 502.5 Z" fill="#d4af6a" opacity="0.8"/>
  <text x="84" y="508.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#a59cc0">You need a full birth chart to separate a genuine return from a generic</text>
  <text x="84" y="527.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#a59cc0">transit.</text>
  <path d="M 202.22749999999988 550.4 L 202.6 552.6 L 204.8 553 L 202.6 553.4 L 202.22749999999988 555.6 L 201.8 553.4 L 199.6 553 L 201.8 552.6 Z" fill="#d4af6a" opacity="0.5"/>
  <text x="380" y="557" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="11.5" fill="#7b738f">A self-reflection framework — tendencies, not predictions</text>
  <path d="M 557.7725000000002 550.4 L 558.2 552.6 L 560.4 553 L 558.2 553.4 L 557.7725000000002 555.6 L 557.4 553.4 L 555.2 553 L 557.4 552.6 Z" fill="#d4af6a" opacity="0.5"/>
