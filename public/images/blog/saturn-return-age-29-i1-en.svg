  <line x1="76" y1="121" x2="76" y2="397" stroke="#d4af6a" stroke-opacity="0.28" stroke-width="1.5"/>
  <circle cx="76" cy="121" r="20.0" fill="url(#saturnreturnage291en-glow)" opacity="0.5"/>
    <circle cx="76" cy="121" r="15" fill="url(#saturnreturnage291en-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="116.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="125.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">1</text>
  <text x="116" y="117.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">Age Window</text>
  <text x="116" y="139.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">The core pass runs roughly from 28 to 30; note where you sit inside that band.</text>
  <circle cx="76" cy="181" r="20.0" fill="url(#saturnreturnage291en-glow)" opacity="0.5"/>
    <circle cx="76" cy="181" r="15" fill="url(#saturnreturnage291en-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="176.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="185.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">2</text>
  <text x="116" y="177.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">Repeat Pressure</text>
  <text x="116" y="199.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">A work, money, or commitment issue you keep postponing starts to demand a</text>
  <text x="116" y="217.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">decision.</text>
  <circle cx="76" cy="259" r="20.0" fill="url(#saturnreturnage291en-glow)" opacity="0.5"/>
    <circle cx="76" cy="259" r="15" fill="url(#saturnreturnage291en-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="254.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="263.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">3</text>
  <text x="116" y="255.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">Structural Questions</text>
  <text x="116" y="277.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">You catch yourself asking whether a career, city, or relationship is actually</text>
  <text x="116" y="295.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">yours to keep.</text>
  <circle cx="76" cy="337" r="20.0" fill="url(#saturnreturnage291en-glow)" opacity="0.5"/>
    <circle cx="76" cy="337" r="15" fill="url(#saturnreturnage291en-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="332.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="341.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">4</text>
  <text x="116" y="333.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">Reality Checks</text>
  <text x="116" y="355.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">Shortcuts and half-built plans tend to show their cracks now rather than later.</text>
  <circle cx="76" cy="397" r="20.0" fill="url(#saturnreturnage291en-glow)" opacity="0.5"/>
    <circle cx="76" cy="397" r="15" fill="url(#saturnreturnage291en-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="392.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="401.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">5</text>
  <text x="116" y="393.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">A Pull Toward the Durable</text>
  <text x="116" y="415.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">Play can feel thinner, and you may notice a wish for work that lasts.</text>
  <path d="M 202.22749999999988 440.4 L 202.6 442.6 L 204.8 443 L 202.6 443.4 L 202.22749999999988 445.6 L 201.8 443.4 L 199.6 443 L 201.8 442.6 Z" fill="#d4af6a" opacity="0.5"/>
  <text x="380" y="447" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="11.5" fill="#7b738f">A self-reflection framework — tendencies, not predictions</text>
