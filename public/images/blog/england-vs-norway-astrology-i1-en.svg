"#cfc8ea" opacity="0.49"/><circle cx="153.5" cy="228.8" r="0.81" fill="#cfc8ea" opacity="0.31"/><circle cx="600.9" cy="279.3" r="1.04" fill="#cfc8ea" opacity="0.20"/><circle cx="312.5" cy="243.0" r="1.23" fill="#cfc8ea" opacity="0.41"/><circle cx="514.4" cy="333.1" r="0.76" fill="#cfc8ea" opacity="0.43"/><circle cx="421.5" cy="360.1" r="1.43" fill="#cfc8ea" opacity="0.46"/><circle cx="412.3" cy="370.9" r="0.85" fill="#cfc8ea" opacity="0.34"/><circle cx="679.2" cy="95.8" r="1.52" fill="#cfc8ea" opacity="0.49"/><circle cx="685.4" cy="405.0" r="0.99" fill="#cfc8ea" opacity="0.50"/><circle cx="332.7" cy="149.1" r="0.99" fill="#cfc8ea" opacity="0.37"/><circle cx="77.6" cy="266.6" r="0.53" fill="#cfc8ea" opacity="0.27"/><circle cx="616.7" cy="224.3" r="1.41" fill="#cfc8ea" opacity="0.43"/><circle cx="100.9" cy="469.4" r="0.77" fill="#cfc8ea" opacity="0.53"/><circle cx="313.1" cy="327.5" r="0.67" fill="#cfc8ea" opacity="0.32"/><circle cx="581.3" cy="419.9" r="1.15" fill="#cfc8ea" opacity="0.52"/><circle cx="229.7" cy="446.1" r="1.54" fill="#cfc8ea" opacity="0.34"/><path d="M 732.5377123896033 237.0 L 732.9 239.1 L 735.0 239.45127795776352 L 732.9 239.8 L 732.5377123896033 241.9 L 732.2 239.8 L 730.1 239.45127795776352 L 732.2 239.1 Z" fill="#f6e6bf" opacity="0.7871330653317272"/><path d="M 104.3104893732816 242.3 L 104.9 245.4 L 108.0 245.98470489354804 L 104.9 246.6 L 104.3104893732816 249.7 L 103.7 246.6 L 100.6 245.98470489354804 L 103.7 245.4 Z" fill="#f6e6bf" opacity="0.5168376889079809"/><path d="M 561.8785424027592 150.4 L 562.3 152.7 L 564.7 153.15105261607096 L 562.3 153.6 L 561.8785424027592 155.9 L 561.4 153.6 L 559.1 153.15105261607096 L 561.4 152.7 Z" fill="#f6e6bf" opacity="0.5975593092851341"/><path d="M 695.7293039578944 211.1 L 696.4 214.3 L 699.6 214.94280116492882 L 696.4 215.6 L 695.7293039578944 218.8 L 695.1 215.6 L 691.8 214.94280116492882 L 695.1 214.3 Z" fill="#f6e6bf" opacity="0.7300518775358796"/><path d="M 676.7226125244051 422.4 L 677.4 425.7 L