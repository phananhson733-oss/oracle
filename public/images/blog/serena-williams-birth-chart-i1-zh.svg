    <text x="76" y="125.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">1</text>
  <text x="116" y="117.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">确定太阳星座</text>
  <text x="116" y="139.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">天秤座太阳体现本能的外交倾向和对公正的强烈追求</text>
  <circle cx="76" cy="181" r="20.0" fill="url(#serenawilliamsbirthchart1zh-glow)" opacity="0.5"/>
    <circle cx="76" cy="181" r="15" fill="url(#serenawilliamsbirthchart1zh-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="176.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="185.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">2</text>
  <text x="116" y="177.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">查看月亮星座</text>
  <text x="116" y="199.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">处女座月亮表现为日常化、列清单，以及压力下的自我修正反射</text>
  <circle cx="76" cy="241" r="20.0" fill="url(#serenawilliamsbirthchart1zh-glow)" opacity="0.5"/>
    <circle cx="76" cy="241" r="15" fill="url(#serenawilliamsbirthchart1zh-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="236.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="245.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">3</text>
  <text x="116" y="237.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">将上升星座视为未定</text>
  <text x="116" y="259.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">在信任任何单一来源前，核对至少两个来源及精确出生时间</text>
  <circle cx="76" cy="301" r="20.0" fill="url(#serenawilliamsbirthchart1zh-glow)" opacity="0.5"/>
    <circle cx="76" cy="301" r="15" fill="url(#serenawilliamsbirthchart1zh-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="296.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="305.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">4</text>
  <text x="116" y="297.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">寻找风土元素的张力</text>
  <text x="116" y="319.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">太阳在风象加月亮在土象，通常表现为光鲜社交外表下严苛的内在标准</text>
  <circle cx="76" cy="361" r="20.0" fill="url(#serenawilliamsbirthchart1zh-glow)" opacity="0.5"/>
    <circle cx="76" cy="361" r="15" fill="url(#serenawilliamsbirthchart1zh-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="356.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="365.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">5</text>
  <text x="116" y="357.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">观察压力下的行为</text>
  <text x="116" y="379.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">这一配置在公开场合保持沉稳优雅，同时在私下不断提高标准</text>
