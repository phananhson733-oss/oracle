    <circle cx="92" cy="410" r="8" fill="url(#saturnreturninaries0en-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="92" cy="407.8" r="4.8" fill="#ffffff" opacity="0.10"/>
