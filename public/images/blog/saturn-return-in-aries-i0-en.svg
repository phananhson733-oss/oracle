  <text x="132" y="118.0" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="700" letter-spacing="0.4" fill="#f6e6bf">2025</text>
  <text x="132" y="141.0" font-family="Georgia, 'Times New Roman', serif" font-size="20.5" fill="#f3effb">Act One: The Opening</text>
  <text x="132" y="164.0" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#a59cc0">Saturn enters Aries; first identity questions surface around work, direction, or a</text>
  <text x="132" y="181.0" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#a59cc0">role quietly outgrown.</text>
  <circle cx="92" cy="212" r="13.0" fill="url(#saturnreturninaries0en-glow)" opacity="0.5"/>
    <circle cx="92" cy="212" r="8" fill="url(#saturnreturninaries0en-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="92" cy="209.8" r="4.8" fill="#ffffff" opacity="0.10"/>
    <path d="M 92 208.0 L 92.6 211.4 L 96.0 212 L 92.6 212.6 L 92 216.0 L 91.4 212.6 L 88.0 212 L 91.4 211.4 Z" fill="#3a2c12" opacity="0.85"/>
  <text x="132" y="217.0" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="700" letter-spacing="0.4" fill="#f6e6bf">September 2025</text>
  <text x="132" y="240.0" font-family="Georgia, 'Times New Roman', serif" font-size="20.5" fill="#f3effb">Act Two: The Retreat</text>
  <text x="132" y="263.0" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#a59cc0">Saturn steps back into Pisces; the theme goes quiet or turns inward before it fully</text>
  <text x="132" y="280.0" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#a59cc0">resolves.</text>
  <circle cx="92" cy="311" r="13.0" fill="url(#saturnreturninaries0en-glow)" opacity="0.5"/>
    <circle cx="92" cy="311" r="8" fill="url(#saturnreturninaries0en-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="92" cy="308.8" r="4.8" fill="#ffffff" opacity="0.10"/>
