  <text x="132" y="381.0" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="700" letter-spacing="0.4" fill="#f6e6bf">7月22–23日</text>
  <text x="132" y="404.0" font-family="Georgia, 'Times New Roman', serif" font-size="20.5" fill="#f3effb">季节结束，水星恢复顺行</text>
  <text x="132" y="427.0" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#a59cc0">太阳约于7月22日进入狮子座；水星约在7月23日恢复顺行，情感循环与沟通绕圈逐渐平息</text>
