  <text x="132" y="299.0" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="700" letter-spacing="0.4" fill="#f6e6bf">约7月6日</text>
  <text x="132" y="322.0" font-family="Georgia, 'Times New Roman', serif" font-size="20.5" fill="#f3effb">太阳四分白羊座土星</text>
  <text x="132" y="345.0" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#a59cc0">精确四分相使情感需求与责任相对，这是促使建立可持续边界的摩擦，而非失败</text>
