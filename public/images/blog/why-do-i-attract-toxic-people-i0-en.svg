    <circle cx="76" cy="455.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="464.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">5</text>
  <text x="116" y="456.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">Compare Against Real Life</text>
  <text x="116" y="478.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">Hold the symbolism next to patterns you actually recognize — a mismatched</text>
  <text x="116" y="496.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">marker is information too, not a verdict</text>
