    <text x="76" y="386.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">4</text>
  <text x="116" y="378.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">Scan Outer-Planet Contacts</text>
  <text x="116" y="400.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">Neptune aspects can blur discernment; Pluto aspects symbolize intensity and</text>
  <text x="116" y="418.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">control themes</text>
