  <text x="116" y="222.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">Locate the Ruling Planet</text>
  <text x="116" y="244.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">Note its sign, house, and any tense aspects — it carries the Descendant's story</text>
  <text x="116" y="262.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">into another corner of the chart</text>
