    <text x="76" y="152.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">1</text>
  <text x="116" y="144.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">Find the Descendant Sign</text>
  <text x="116" y="166.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">Opposite your rising sign on the chart's western edge — it sets the relational</text>
  <text x="116" y="184.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">archetype you tend to notice</text>
