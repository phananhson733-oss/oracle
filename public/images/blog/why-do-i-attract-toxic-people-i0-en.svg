    <text x="76" y="308.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">3</text>
  <text x="116" y="300.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">Check Seventh-House Tenants</text>
  <text x="116" y="322.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">Planets here, especially Pluto or Saturn, intensify boundary themes inside</text>
  <text x="116" y="340.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">close bonds</text>
