  <text x="380" y="46" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.4" fill="#efeaf8">出生星盘中水瓶座突破模式的五个关键信号</text>
  <line x1="230" y1="67" x2="368" y2="67" stroke="url(#nikobirthchart1zh-rule)" stroke-width="1"/>
  <line x1="392" y1="67" x2="530" y2="67" stroke="url(#nikobirthchart1zh-rule)" stroke-width="1"/>
  <path d="M 380 62.0 L 380.8 66.2 L 385.0 67 L 380.8 67.8 L 380 72.0 L 379.2 67.8 L 375.0 67 L 379.2 66.2 Z" fill="#d4af6a" opacity="0.85"/>
  <line x1="76" y1="121" x2="76" y2="433" stroke="#d4af6a" stroke-opacity="0.28" stroke-width="1.5"/>
  <circle cx="76" cy="121" r="20.0" fill="url(#nikobirthchart1zh-glow)" opacity="0.5"/>
    <circle cx="76" cy="121" r="15" fill="url(#nikobirthchart1zh-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="116.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="125.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">1</text>
  <text x="116" y="117.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">太阳位于水瓶座晚期——第三区间（2月10–18日）</text>
  <text x="116" y="139.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">固定特质在此最为强烈；个人常被认定为最强表现者，但被视为难以构建团队核心——周</text>
  <text x="116" y="157.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">围群体尚未形成理解其所做之事的语言</text>
  <circle cx="76" cy="199" r="20.0" fill="url(#nikobirthchart1zh-glow)" opacity="0.5"/>
    <circle cx="76" cy="199" r="15" fill="url(#nikobirthchart1zh-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="194.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="203.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">2</text>
  <text x="116" y="195.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">木星-海王星职业宫接触</text>
  <text x="116" y="217.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">木星放大才能，海王星溶解结构框架；产出卓越但团队契合度滞后，直至稳定配置围绕</text>
  <text x="116" y="235.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">现有水准最终形成</text>
  <circle cx="76" cy="277" r="20.0" fill="url(#nikobirthchart1zh-glow)" opacity="0.5"/>
    <circle cx="76" cy="277" r="15" fill="url(#nikobirthchart1zh-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="272.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="281.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">3</text>
  <text x="116" y="273.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">固定太阳与变动宫强调</text>
  <text x="116" y="295.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">稳定的核心身份在漫长赛季中遭遇变动的外部情境；突破随情境稳定而来，而非个人向</text>
  <text x="116" y="313.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">下适应</text>
  <circle cx="76" cy="355" r="20.0" fill="url(#nikobirthchart1zh-glow)" opacity="0.5"/>
    <circle cx="76" cy="355" r="15" fill="url(#nikobirthchart1zh-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="350.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="359.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">4</text>
  <text x="116" y="351.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">第七宫能量微弱</text>
  <text x="116" y="373.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">水瓶座推迟真正的集体合作，直到出现能承载个人水准的团队配置；寻找差一点的模式</text>
  <text x="116" y="391.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">，而非努力层面的失败</text>
  <circle cx="76" cy="433" r="20.0" fill="url(#nikobirthchart1zh-glow)" opacity="0.5"/>
    <circle cx="76" cy="433" r="15" fill="url(#nikobirthchart1zh-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="428.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="437.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">5</text>
  <text x="116" y="429.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">土星回归时间窗口（27–30岁）</text>
  <text x="116" y="451.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">这一过境常作为水瓶座突破的结构性触发点——长期持有的愿景在此结晶为集体形式，或</text>
  <text x="116" y="469.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">个人向能承载其愿景的新情境重新校准</text>
  <path d="M 280.025 494.4 L 280.4 496.6 L 282.6 497 L 280.4 497.4 L 280.025 499.6 L 279.6 497.4 L 277.4 497 L 279.6 496.6 Z" fill="#d4af6a" opacity="0.5"/>
  <text x="380" y="501" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="11.5" fill="#7b738f">自我反思框架，描述倾向而非预测</text>
  <path d="M 479.975 494.4 L 480.4 496.6 L 482.6 497 L 480.4 497.4 L 479.975 499.6 L 479.6 497.4 L 477.4 497 L 479.6 496.6 Z" fill="#d4af6a" opacity="0.5"/>
</svg>
