    <text x="76" y="125.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">1</text>
  <text x="116" y="117.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">太阳星座就是这个人</text>
  <text x="116" y="139.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">双鱼太阳只是一条线索，而非完整身份——月亮、上升和相位会彻底改变其含义</text>
  <circle cx="76" cy="181" r="20.0" fill="url(#elliotpagebirthchart1zh-glow)" opacity="0.5"/>
    <circle cx="76" cy="181" r="15" fill="url(#elliotpagebirthchart1zh-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="176.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="185.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">2</text>
  <text x="116" y="177.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">星盘证明传记事实</text>
  <text x="116" y="199.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">本命盘描述象征性倾向，而非记录事件或个人隐私</text>
  <circle cx="76" cy="241" r="20.0" fill="url(#elliotpagebirthchart1zh-glow)" opacity="0.5"/>
    <circle cx="76" cy="241" r="15" fill="url(#elliotpagebirthchart1zh-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="236.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="245.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">3</text>
  <text x="116" y="237.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">行星位置预测未来</text>
  <text x="116" y="259.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">解盘只描绘模式与主题，而非固定结果——没有任何位置能决定一个人必须做什么</text>
  <circle cx="76" cy="301" r="20.0" fill="url(#elliotpagebirthchart1zh-glow)" opacity="0.5"/>
    <circle cx="76" cy="301" r="15" fill="url(#elliotpagebirthchart1zh-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="296.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="305.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">4</text>
  <text x="116" y="297.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">一个位置解码身份</text>
  <text x="116" y="319.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">没有任何单一符号能解释一个人的身份——将星盘简化为单一标签会错失全貌</text>
