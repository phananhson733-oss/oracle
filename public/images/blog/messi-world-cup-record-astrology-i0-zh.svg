  <text x="116" y="117.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">锚定事实</text>
  <text x="116" y="139.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">1987 年 6 月 24 日罗萨里奥出生的巨蟹太阳；2006-2022 五届世界杯</text>
  <circle cx="76" cy="181" r="20.0" fill="url(#messiworldcuprecordastrology0zh-glow)" opacity="0.5"/>
    <circle cx="76" cy="181" r="15" fill="url(#messiworldcuprecordastrology0zh-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="176.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="185.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">2</text>
  <text x="116" y="177.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">读巨蟹太阳</text>
  <text x="116" y="199.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">对家国与家庭的象征性深情，国家队球衣为何最重</text>
  <circle cx="76" cy="241" r="20.0" fill="url(#messiworldcuprecordastrology0zh-glow)" opacity="0.5"/>
    <circle cx="76" cy="241" r="15" fill="url(#messiworldcuprecordastrology0zh-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="236.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="245.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">3</text>
  <text x="116" y="237.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">长弧当作土星节奏</text>
  <text x="116" y="259.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">十六年修行，超过土星约 29.4 年周期的半圈</text>
  <circle cx="76" cy="301" r="20.0" fill="url(#messiworldcuprecordastrology0zh-glow)" opacity="0.5"/>
    <circle cx="76" cy="301" r="15" fill="url(#messiworldcuprecordastrology0zh-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="296.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="305.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">4</text>
  <text x="116" y="297.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">框定 2022 夺冠</text>
  <text x="116" y="319.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">在约 2016-17 年首次土星回归之后多年才抵达的门槛</text>
  <circle cx="76" cy="361" r="20.0" fill="url(#messiworldcuprecordastrology0zh-glow)" opacity="0.5"/>
    <circle cx="76" cy="361" r="15" fill="url(#messiworldcuprecordastrology0zh-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="356.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="365.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">5</text>
  <text x="116" y="357.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">让原型保持开放</text>
  <text x="116" y="379.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">一个有意义的季节，而非固定结局；让未来保持开放</text>
