    <circle cx="76" cy="143.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="152.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">1</text>
  <text x="116" y="144.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">Calculator output as the reading</text>
  <text x="116" y="166.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">The wheel is raw data; meaning only appears once Jyotish rules are applied</text>
  <circle cx="76" cy="208" r="20.0" fill="url(#birthchartinterpretation2en-glow)" opacity="0.5"/>
    <circle cx="76" cy="208" r="15" fill="url(#birthchartinterpretation2en-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="203.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="212.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">2</text>
  <text x="116" y="204.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">Reading the Sun sign first</text>
  <text x="116" y="226.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">Vedic practice leans on the Moon sign and Lagna — Sun-first skews the whole</text>
  <text x="116" y="244.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">picture</text>
  <circle cx="76" cy="286" r="20.0" fill="url(#birthchartinterpretation2en-glow)" opacity="0.5"/>
    <circle cx="76" cy="286" r="15" fill="url(#birthchartinterpretation2en-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="281.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="290.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">3</text>
  <text x="116" y="282.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">Taking a placement as fate</text>
  <text x="116" y="304.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">A hard placement points to a tendency you may notice, not an outcome locked in</text>
  <circle cx="76" cy="346" r="20.0" fill="url(#birthchartinterpretation2en-glow)" opacity="0.5"/>
    <circle cx="76" cy="346" r="15" fill="url(#birthchartinterpretation2en-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="341.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="350.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">4</text>
  <text x="116" y="342.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">Ignoring the lordships</text>
  <text x="116" y="364.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">Skipping which planet rules which house strips out half the story the chart</text>
  <text x="116" y="382.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">tells</text>
