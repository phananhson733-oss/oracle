  <text x="116" y="177.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">2. 权衡月亮星座</text>
  <text x="116" y="199.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">白羊月亮——直接、热烈、反应迅速的情感本能</text>
  <circle cx="76" cy="241" r="20.0" fill="url(#cardibbirthchart1zh-glow)" opacity="0.5"/>
