  <circle cx="76" cy="121" r="20.0" fill="url(#erlinghaalandbirthchart0zh-glow)" opacity="0.5"/>
    <circle cx="76" cy="121" r="15" fill="url(#erlinghaalandbirthchart0zh-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="116.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="125.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">1</text>
  <text x="116" y="117.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">锚定可核实的记录</text>
  <text x="116" y="139.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">2000 年 7 月 21 日生于利兹，太阳落在巨蟹座末度约 28 到 29 度，贴近交界</text>
  <circle cx="76" cy="181" r="20.0" fill="url(#erlinghaalandbirthchart0zh-glow)" opacity="0.5"/>
    <circle cx="76" cy="181" r="15" fill="url(#erlinghaalandbirthchart0zh-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="176.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="185.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">2</text>
  <text x="116" y="177.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">把交界读成融合</text>
  <text x="116" y="199.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">巨蟹的坚韧与护持，挨着狮子对决定性、可见收尾的胃口</text>
  <circle cx="76" cy="241" r="20.0" fill="url(#erlinghaalandbirthchart0zh-glow)" opacity="0.5"/>
    <circle cx="76" cy="241" r="15" fill="url(#erlinghaalandbirthchart0zh-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="236.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="245.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">3</text>
  <text x="116" y="237.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">把缺失大声标出来</text>
  <text x="116" y="259.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">没有核验过的出生时间，月亮、上升与宫位都属未知，抵制任何倚仗它们的解读</text>
  <circle cx="76" cy="301" r="20.0" fill="url(#erlinghaalandbirthchart0zh-glow)" opacity="0.5"/>
    <circle cx="76" cy="301" r="15" fill="url(#erlinghaalandbirthchart0zh-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="296.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="305.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">4</text>
  <text x="116" y="297.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">把行运背景当主题</text>
  <text x="116" y="319.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">木星在 2026 年 6 月 30 日前行经巨蟹座，掠过他的太阳，随后跨入狮子座</text>
  <circle cx="76" cy="361" r="20.0" fill="url(#erlinghaalandbirthchart0zh-glow)" opacity="0.5"/>
    <circle cx="76" cy="361" r="15" fill="url(#erlinghaalandbirthchart0zh-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="356.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="365.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">5</text>
  <text x="116" y="357.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">握成象征框架</text>
  <text x="116" y="379.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">一段观察气质的象征框架；挪威已出线，但让球场上的每个结果保持未定</text>
  <path d="M 280.025 404.4 L 280.4 406.6 L 282.6 407 L 280.4 407.4 L 280.025 409.6 L 279.6 407.4 L 277.4 407 L 279.6 406.6 Z" fill="#d4af6a" opacity="0.5"/>
  <text x="380" y="411" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="11.5" fill="#7b738f">自我反思框架，描述倾向而非预测</text>
  <path d="M 479.975 404.4 L 480.4 406.6 L 482.6 407 L 480.4 407.4 L 479.975 409.6 L 479.6 407.4 L 477.4 407 L 479.6 406.6 Z" fill="#d4af6a" opacity="0.5"/>
