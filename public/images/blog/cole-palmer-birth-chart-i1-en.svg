  <line x1="392" y1="67" x2="530" y2="67" stroke="url(#colepalmerbirthchart1en-rule)" stroke-width="1"/>
  <path d="M 380 62.0 L 380.8 66.2 L 385.0 67 L 380.8 67.8 L 380 72.0 L 379.2 67.8 L 375.0 67 L 379.2 66.2 Z" fill="#d4af6a" opacity="0.85"/>
  <line x1="76" y1="121" x2="76" y2="379" stroke="#d4af6a" stroke-opacity="0.28" stroke-width="1.5"/>
  <circle cx="76" cy="121" r="20.0" fill="url(#colepalmerbirthchart1en-glow)" opacity="0.5"/>
    <circle cx="76" cy="121" r="15" fill="url(#colepalmerbirthchart1en-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="116.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="125.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">1</text>
  <text x="116" y="117.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">Start with the Sun</text>
  <text x="116" y="139.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">Note Taurus themes as tendencies, not verdicts about who he is</text>
  <circle cx="76" cy="181" r="20.0" fill="url(#colepalmerbirthchart1en-glow)" opacity="0.5"/>
    <circle cx="76" cy="181" r="15" fill="url(#colepalmerbirthchart1en-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="176.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="185.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">2</text>
  <text x="116" y="177.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">Flag what you cannot verify</text>
  <text x="116" y="199.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">Moon and rising sign are estimates without a confirmed birth time</text>
  <circle cx="76" cy="241" r="20.0" fill="url(#colepalmerbirthchart1en-glow)" opacity="0.5"/>
    <circle cx="76" cy="241" r="15" fill="url(#colepalmerbirthchart1en-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="236.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="245.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">3</text>
  <text x="116" y="237.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">Match symbol to persona</text>
  <text x="116" y="259.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">Connect 'unhurried' to how he carries himself, never to a specific goal or</text>
  <text x="116" y="277.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">result</text>
  <circle cx="76" cy="319" r="20.0" fill="url(#colepalmerbirthchart1en-glow)" opacity="0.5"/>
    <circle cx="76" cy="319" r="15" fill="url(#colepalmerbirthchart1en-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="314.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="323.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">4</text>
  <text x="116" y="315.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">Watch your language</text>
  <text x="116" y="337.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">Swap 'this means he is' for 'this placement is associated with'</text>
  <circle cx="76" cy="379" r="20.0" fill="url(#colepalmerbirthchart1en-glow)" opacity="0.5"/>
    <circle cx="76" cy="379" r="15" fill="url(#colepalmerbirthchart1en-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="374.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="383.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">5</text>
  <text x="116" y="375.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">Compare read to read</text>
  <text x="116" y="397.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">Disagreement between profiles proves you are seeing interpretation, not fact</text>
  <path d="M 202.22749999999988 422.4 L 202.6 424.6 L 204.8 425 L 202.6 425.4 L 202.22749999999988 427.6 L 201.8 425.4 L 199.6 425 L 201.8 424.6 Z" fill="#d4af6a" opacity="0.5"/>
  <text x="380" y="429" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="11.5" fill="#7b738f">A self-reflection framework — tendencies, not predictions</text>
