    <text x="76" y="125.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">1</text>
  <text x="116" y="117.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">日月同星座</text>
  <text x="116" y="139.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">呈现自给自足感；身份与情感之间无明显裂痕，因为内在本就如此</text>
  <circle cx="76" cy="181" r="20.0" fill="url(#princewilliambirthchart1zh-glow)" opacity="0.5"/>
    <circle cx="76" cy="181" r="15" fill="url(#princewilliambirthchart1zh-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="176.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="185.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">2</text>
  <text x="116" y="177.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">压力下的巨蟹月亮</text>
  <text x="116" y="199.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">情绪本能是悄然保护与退缩——平静的外表反映的是选择，而非感受的缺失</text>
  <circle cx="76" cy="241" r="20.0" fill="url(#princewilliambirthchart1zh-glow)" opacity="0.5"/>
    <circle cx="76" cy="241" r="15" fill="url(#princewilliambirthchart1zh-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="236.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="245.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">3</text>
  <text x="116" y="237.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">射手上升的公众形象</text>
  <text x="116" y="259.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">给人温暖自信、自在从容的第一印象；与内在情感世界之间存在真实落差</text>
  <circle cx="76" cy="301" r="20.0" fill="url(#princewilliambirthchart1zh-glow)" opacity="0.5"/>
    <circle cx="76" cy="301" r="15" fill="url(#princewilliambirthchart1zh-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="296.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="305.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">4</text>
  <text x="116" y="297.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">海王星合上升点</text>
  <text x="116" y="319.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">吸收周围环境的情绪氛围并反射出略带理想化的印象；不同观察者对其解读各异</text>
  <circle cx="76" cy="361" r="20.0" fill="url(#princewilliambirthchart1zh-glow)" opacity="0.5"/>
    <circle cx="76" cy="361" r="15" fill="url(#princewilliambirthchart1zh-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="356.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="365.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">5</text>
  <text x="116" y="357.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">2026年三重叠合</text>
  <text x="116" y="379.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">生日、父亲节与夏至同落2026年6月21日，巨蟹季能量高度集中</text>
