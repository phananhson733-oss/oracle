    <text x="76" y="185.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">2</text>
  <text x="116" y="177.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">追踪木星入巨蟹</text>
  <text x="116" y="199.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">2025至2026年同星座强调，精确相位早于赛事</text>
  <circle cx="76" cy="241" r="20.0" fill="url(#argentinaworldcup2026astrology0zh-glow)" opacity="0.5"/>
    <circle cx="76" cy="241" r="15" fill="url(#argentinaworldcup2026astrology0zh-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="236.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="245.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">3</text>
  <text x="116" y="237.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">追踪土星入白羊</text>
  <text x="116" y="259.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">对巨蟹座太阳形成入相位四分——持续考验季节</text>
  <circle cx="76" cy="301" r="20.0" fill="url(#argentinaworldcup2026astrology0zh-glow)" opacity="0.5"/>
    <circle cx="76" cy="301" r="15" fill="url(#argentinaworldcup2026astrology0zh-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
