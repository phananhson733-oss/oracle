  <circle cx="76" cy="121" r="20.0" fill="url(#karolinamuchovabirthchart0en-glow)" opacity="0.5"/>
    <circle cx="76" cy="121" r="15" fill="url(#karolinamuchovabirthchart0en-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="116.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="125.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">1</text>
  <text x="116" y="117.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">A Bright Front, a Private Core</text>
  <text x="116" y="139.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">Warm and expressive in public, but slow to reveal what is actually happening</text>
  <text x="116" y="157.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">underneath</text>
  <circle cx="76" cy="199" r="20.0" fill="url(#karolinamuchovabirthchart0en-glow)" opacity="0.5"/>
    <circle cx="76" cy="199" r="15" fill="url(#karolinamuchovabirthchart0en-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="194.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="203.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">2</text>
  <text x="116" y="195.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">Recognition That Is Earned, Not Begged For</text>
  <text x="116" y="217.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">The Leo drive for visible achievement approached with Scorpio patience and</text>
  <text x="116" y="235.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">strategy</text>
  <circle cx="76" cy="277" r="20.0" fill="url(#karolinamuchovabirthchart0en-glow)" opacity="0.5"/>
    <circle cx="76" cy="277" r="15" fill="url(#karolinamuchovabirthchart0en-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="272.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="281.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">3</text>
  <text x="116" y="273.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">Calm at the Highest Stakes</text>
  <text x="116" y="295.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">Composure that reads as cool but runs on tightly held intensity, most visible</text>
  <text x="116" y="313.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">in title-deciding moments</text>
  <circle cx="76" cy="355" r="20.0" fill="url(#karolinamuchovabirthchart0en-glow)" opacity="0.5"/>
    <circle cx="76" cy="355" r="15" fill="url(#karolinamuchovabirthchart0en-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="350.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="359.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">4</text>
  <text x="116" y="351.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">Delayed Emotional Disclosure</text>
  <text x="116" y="373.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">Feelings tend to surface later and to fewer people, on the person's own timing</text>
  <circle cx="76" cy="415" r="20.0" fill="url(#karolinamuchovabirthchart0en-glow)" opacity="0.5"/>
    <circle cx="76" cy="415" r="15" fill="url(#karolinamuchovabirthchart0en-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="410.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="419.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">5</text>
  <text x="116" y="411.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">Fixed Determination</text>
  <text x="116" y="433.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">Both Leo and Scorpio are fixed signs — once a goal is set, it rarely wobbles</text>
  <path d="M 202.22749999999988 458.4 L 202.6 460.6 L 204.8 461 L 202.6 461.4 L 202.22749999999988 463.6 L 201.8 461.4 L 199.6 461 L 201.8 460.6 Z" fill="#d4af6a" opacity="0.5"/>
  <text x="380" y="465" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="11.5" fill="#7b738f">A self-reflection framework — tendencies, not predictions</text>
  <path d="M 557.7725000000002 458.4 L 558.2 460.6 L 560.4 461 L 558.2 461.4 L 557.7725000000002 463.6 L 557.4 461.4 L 555.2 461 L 557.4 460.6 Z" fill="#d4af6a" opacity="0.5"/>
