    <text x="76" y="245.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">3</text>
  <text x="116" y="237.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">追踪重复的家庭主题</text>
  <text x="116" y="259.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">频繁搬家、设防的家、难以靠近的家长</text>
  <circle cx="76" cy="301" r="20.0" fill="url(#4thhousemeaning1zh-glow)" opacity="0.5"/>
    <circle cx="76" cy="301" r="15" fill="url(#4thhousemeaning1zh-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
