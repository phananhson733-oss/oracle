    <text x="76" y="245.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">3</text>
  <text x="116" y="237.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">Praise that feels hollow</text>
  <text x="116" y="259.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">Celebrated for a strength that no longer satisfies</text>
  <circle cx="76" cy="301" r="20.0" fill="url(#northnodevssouthnode2en-glow)" opacity="0.5"/>
    <circle cx="76" cy="301" r="15" fill="url(#northnodevssouthnode2en-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
