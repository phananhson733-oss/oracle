<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 286" role="img" aria-label="Green aura shades — and what each one signals: Emerald / vibrant, Forest / deep, Muddy yellow-green, Mint / light">
  <defs>
    <linearGradient id="green-aura-panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16112c"/>
      <stop offset="1" stop-color="#0b0a1b"/>
    </linearGradient>
    <radialGradient id="green-aura-0" cx="0.5" cy="0.45" r="0.62"><stop offset="0" stop-color="#7fe0a0"/><stop offset="1" stop-color="#3f9a64"/></radialGradient>
    <radialGradient id="green-aura-1" cx="0.5" cy="0.45" r="0.62"><stop offset="0" stop-color="#4f9a6a"/><stop offset="1" stop-color="#26603c"/></radialGradient>
    <radialGradient id="green-aura-2" cx="0.5" cy="0.45" r="0.62"><stop offset="0" stop-color="#9aae5a"/><stop offset="1" stop-color="#5e6e2e"/></radialGradient>
    <radialGradient id="green-aura-3" cx="0.5" cy="0.45" r="0.62"><stop offset="0" stop-color="#b8f0d0"/><stop offset="1" stop-color="#7fd0a8"/></radialGradient>
    <filter id="green-aura-soft" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <rect x="1.5" y="1.5" width="837" height="283" rx="22" fill="url(#green-aura-panel)" stroke="#d4af6a" stroke-opacity="0.28"/>
  <text x="44" y="50" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#efeaf8">Green aura shades — and what each one signals</text>
  <line x1="44" y1="68" x2="796" y2="68" stroke="#d4af6a" stroke-opacity="0.18"/>
  <g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">
    <circle cx="157.5" cy="128" r="30" fill="url(#green-aura-0)" filter="url(#green-aura-soft)"/>
    <circle cx="157.5" cy="128" r="23" fill="url(#green-aura-0)"/>
    <text x="157.5" y="186" font-size="17" fill="#f3effb">Emerald / vibrant</text>
    <text x="157.5" y="210" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9a93b5">Active healing and</text>
    <text x="157.5" y="226" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9a93b5">heart-led growth</text>
    <circle cx="332.5" cy="128" r="30" fill="url(#green-aura-1)" filter="url(#green-aura-soft)"/>
    <circle cx="332.5" cy="128" r="23" fill="url(#green-aura-1)"/>
    <text x="332.5" y="186" font-size="17" fill="#f3effb">Forest / deep</text>
    <text x="332.5" y="210" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9a93b5">Compassion grounded into</text>
    <text x="332.5" y="226" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9a93b5">steady stability</text>
    <circle cx="507.5" cy="128" r="30" fill="url(#green-aura-2)" filter="url(#green-aura-soft)"/>
    <circle cx="507.5" cy="128" r="23" fill="url(#green-aura-2)"/>
    <text x="507.5" y="186" font-size="17" fill="#f3effb">Muddy yellow-green</text>
    <text x="507.5" y="210" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9a93b5">Comparison or unprocessed</text>
    <text x="507.5" y="226" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9a93b5">resentment moving through</text>
    <circle cx="682.5" cy="128" r="30" fill="url(#green-aura-3)" filter="url(#green-aura-soft)"/>
    <circle cx="682.5" cy="128" r="23" fill="url(#green-aura-3)"/>
    <text x="682.5" y="186" font-size="17" fill="#f3effb">Mint / light</text>
    <text x="682.5" y="210" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9a93b5">A fresh emotional start</text>
    <text x="682.5" y="226" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9a93b5">and gentle renewal</text>
  </g>
  <text x="420" y="262" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#6f6890">Shade describes a current state, not a fixed trait — most people move across these over time.</text>
</svg>
