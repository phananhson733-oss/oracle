<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 286" role="img" aria-label="绿色气场的色调——各自在说什么: 翠绿 / 鲜亮, 深森林绿, 发浊黄绿, 薄荷浅绿">
  <defs>
    <linearGradient id="green-aura-panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16112c"/>
      <stop offset="1" stop-color="#0b0a1b"/>
    </linearGradient>
    <radialGradient id="green-aura-0" cx="0.5" cy="0.45" r="0.62"><stop offset="0" stop-color="#7fe0a0"/><stop offset="1" stop-color="#3f9a64"/></radialGradient>
    <radialGradient id="green-aura-1" cx="0.5" cy="0.45" r="0.62"><stop offset="0" stop-color="#4f9a6a"/><stop offset="1" stop-color="#26603c"/></radialGradient>
    <radialGradient id="green-aura-2" cx="0.5" cy="0.45" r="0.62"><stop offset="0" stop-color="#9aae5a"/><stop offset="1" stop-color="#5e6e2e"/></radialGradient>
    <radialGradient id="green-aura-3" cx="0.5" cy="0.45" r="0.62"><stop offset="0" stop-color="#b8f0d0"/><stop offset="1" stop-color="#7fd0a8"/></radialGradient>
    <filter id="green-aura-soft" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <rect x="1.5" y="1.5" width="837" height="283" rx="22" fill="url(#green-aura-panel)" stroke="#d4af6a" stroke-opacity="0.28"/>
  <text x="44" y="50" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#efeaf8">绿色气场的色调——各自在说什么</text>
  <line x1="44" y1="68" x2="796" y2="68" stroke="#d4af6a" stroke-opacity="0.18"/>
  <g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">
    <circle cx="157.5" cy="128" r="30" fill="url(#green-aura-0)" filter="url(#green-aura-soft)"/>
    <circle cx="157.5" cy="128" r="23" fill="url(#green-aura-0)"/>
    <text x="157.5" y="186" font-size="17" fill="#f3effb">翠绿 / 鲜亮</text>
    <text x="157.5" y="210" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9a93b5">主动疗愈，</text>
    <text x="157.5" y="226" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9a93b5">心轮带动的成长</text>
    <circle cx="332.5" cy="128" r="30" fill="url(#green-aura-1)" filter="url(#green-aura-soft)"/>
    <circle cx="332.5" cy="128" r="23" fill="url(#green-aura-1)"/>
    <text x="332.5" y="186" font-size="17" fill="#f3effb">深森林绿</text>
    <text x="332.5" y="210" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9a93b5">把关怀沉淀成</text>
    <text x="332.5" y="226" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9a93b5">稳定的存在感</text>
    <circle cx="507.5" cy="128" r="30" fill="url(#green-aura-2)" filter="url(#green-aura-soft)"/>
    <circle cx="507.5" cy="128" r="23" fill="url(#green-aura-2)"/>
    <text x="507.5" y="186" font-size="17" fill="#f3effb">发浊黄绿</text>
    <text x="507.5" y="210" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9a93b5">比较心或没消化的</text>
    <text x="507.5" y="226" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9a93b5">怨气在流动</text>
    <circle cx="682.5" cy="128" r="30" fill="url(#green-aura-3)" filter="url(#green-aura-soft)"/>
    <circle cx="682.5" cy="128" r="23" fill="url(#green-aura-3)"/>
    <text x="682.5" y="186" font-size="17" fill="#f3effb">薄荷浅绿</text>
    <text x="682.5" y="210" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9a93b5">情绪重新开始，</text>
    <text x="682.5" y="226" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9a93b5">温和地回血</text>
  </g>
  <text x="420" y="262" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#6f6890">色调说的是当下状态，不是固定特质——多数人会随时间在这些之间移动。</text>
</svg>
