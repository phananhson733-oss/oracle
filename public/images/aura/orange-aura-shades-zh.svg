<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 286" role="img" aria-label="橙色气场的色调——各自在说什么: 鲜明橙, 暗浊橙, 琥珀金橙">
  <defs>
    <linearGradient id="orange-aura-panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16112c"/>
      <stop offset="1" stop-color="#0b0a1b"/>
    </linearGradient>
    <radialGradient id="orange-aura-0" cx="0.5" cy="0.45" r="0.62"><stop offset="0" stop-color="#ffb15a"/><stop offset="1" stop-color="#e07a1f"/></radialGradient>
    <radialGradient id="orange-aura-1" cx="0.5" cy="0.45" r="0.62"><stop offset="0" stop-color="#9a6a3a"/><stop offset="1" stop-color="#5e3c1c"/></radialGradient>
    <radialGradient id="orange-aura-2" cx="0.5" cy="0.45" r="0.62"><stop offset="0" stop-color="#ffcf7a"/><stop offset="1" stop-color="#d99a2e"/></radialGradient>
    <filter id="orange-aura-soft" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <rect x="1.5" y="1.5" width="837" height="283" rx="22" fill="url(#orange-aura-panel)" stroke="#d4af6a" stroke-opacity="0.28"/>
  <text x="44" y="50" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#efeaf8">橙色气场的色调——各自在说什么</text>
  <line x1="44" y1="68" x2="796" y2="68" stroke="#d4af6a" stroke-opacity="0.18"/>
  <g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">
    <circle cx="186.7" cy="128" r="30" fill="url(#orange-aura-0)" filter="url(#orange-aura-soft)"/>
    <circle cx="186.7" cy="128" r="23" fill="url(#orange-aura-0)"/>
    <text x="186.7" y="186" font-size="17" fill="#f3effb">鲜明橙</text>
    <text x="186.7" y="210" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9a93b5">创造驱动力与社交</text>
    <text x="186.7" y="226" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9a93b5">温度向外流动</text>
    <circle cx="420.0" cy="128" r="30" fill="url(#orange-aura-1)" filter="url(#orange-aura-soft)"/>
    <circle cx="420.0" cy="128" r="23" fill="url(#orange-aura-1)"/>
    <text x="420.0" y="186" font-size="17" fill="#f3effb">暗浊橙</text>
    <text x="420.0" y="210" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9a93b5">给予转向内耗：</text>
    <text x="420.0" y="226" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9a93b5">愧疚或被掏空</text>
    <circle cx="653.3" cy="128" r="30" fill="url(#orange-aura-2)" filter="url(#orange-aura-soft)"/>
    <circle cx="653.3" cy="128" r="23" fill="url(#orange-aura-2)"/>
    <text x="653.3" y="186" font-size="17" fill="#f3effb">琥珀金橙</text>
    <text x="653.3" y="210" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9a93b5">成熟的创造力，带</text>
    <text x="653.3" y="226" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9a93b5">温暖沉稳的权威感</text>
  </g>
  <text x="420" y="262" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#6f6890">色调说的是当下状态，不是固定特质——多数人会随时间在这些之间移动。</text>
</svg>
