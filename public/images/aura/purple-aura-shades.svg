<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 286" role="img" aria-label="Purple aura shades — and what each one signals: Light / lavender, Mid, Deep / near-indigo, Purple-blue">
  <defs>
    <linearGradient id="purple-aura-panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16112c"/>
      <stop offset="1" stop-color="#0b0a1b"/>
    </linearGradient>
    <radialGradient id="purple-aura-0" cx="0.5" cy="0.45" r="0.62"><stop offset="0" stop-color="#cdb6ff"/><stop offset="1" stop-color="#9a7ee0"/></radialGradient>
    <radialGradient id="purple-aura-1" cx="0.5" cy="0.45" r="0.62"><stop offset="0" stop-color="#b89cff"/><stop offset="1" stop-color="#7250c0"/></radialGradient>
    <radialGradient id="purple-aura-2" cx="0.5" cy="0.45" r="0.62"><stop offset="0" stop-color="#8a6ad0"/><stop offset="1" stop-color="#4f3a9f"/></radialGradient>
    <radialGradient id="purple-aura-3" cx="0.5" cy="0.45" r="0.62"><stop offset="0" stop-color="#9c8ce0"/><stop offset="1" stop-color="#5a6ec0"/></radialGradient>
    <filter id="purple-aura-soft" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <rect x="1.5" y="1.5" width="837" height="283" rx="22" fill="url(#purple-aura-panel)" stroke="#d4af6a" stroke-opacity="0.28"/>
  <text x="44" y="50" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#efeaf8">Purple aura shades — and what each one signals</text>
  <line x1="44" y1="68" x2="796" y2="68" stroke="#d4af6a" stroke-opacity="0.18"/>
  <g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">
    <circle cx="157.5" cy="128" r="30" fill="url(#purple-aura-0)" filter="url(#purple-aura-soft)"/>
    <circle cx="157.5" cy="128" r="23" fill="url(#purple-aura-0)"/>
    <text x="157.5" y="186" font-size="17" fill="#f3effb">Light / lavender</text>
    <text x="157.5" y="210" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9a93b5">Soft inward attention,</text>
    <text x="157.5" y="226" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9a93b5">felt-sense before words</text>
    <circle cx="332.5" cy="128" r="30" fill="url(#purple-aura-1)" filter="url(#purple-aura-soft)"/>
    <circle cx="332.5" cy="128" r="23" fill="url(#purple-aura-1)"/>
    <text x="332.5" y="186" font-size="17" fill="#f3effb">Mid</text>
    <text x="332.5" y="210" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9a93b5">Steady symbol- and</text>
    <text x="332.5" y="226" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9a93b5">meaning-seeking</text>
    <circle cx="507.5" cy="128" r="30" fill="url(#purple-aura-2)" filter="url(#purple-aura-soft)"/>
    <circle cx="507.5" cy="128" r="23" fill="url(#purple-aura-2)"/>
    <text x="507.5" y="186" font-size="17" fill="#f3effb">Deep / near-indigo</text>
    <text x="507.5" y="210" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9a93b5">Strong inner pattern</text>
    <text x="507.5" y="226" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9a93b5">recognition</text>
    <circle cx="682.5" cy="128" r="30" fill="url(#purple-aura-3)" filter="url(#purple-aura-soft)"/>
    <circle cx="682.5" cy="128" r="23" fill="url(#purple-aura-3)"/>
    <text x="682.5" y="186" font-size="17" fill="#f3effb">Purple-blue</text>
    <text x="682.5" y="210" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9a93b5">Inner meaning trying</text>
    <text x="682.5" y="226" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9a93b5">to become words</text>
  </g>
  <text x="420" y="262" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#6f6890">Shade describes a current state, not a fixed trait — most people move across these over time.</text>
</svg>
