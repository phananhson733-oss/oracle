<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 286" role="img" aria-label="How red aura differs from its neighbors: Orange, Yellow">
  <defs>
    <linearGradient id="red-aura-panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16112c"/>
      <stop offset="1" stop-color="#0b0a1b"/>
    </linearGradient>
    <radialGradient id="red-aura-0" cx="0.5" cy="0.45" r="0.62"><stop offset="0" stop-color="#ffb15a"/><stop offset="1" stop-color="#d97724"/></radialGradient>
    <radialGradient id="red-aura-1" cx="0.5" cy="0.45" r="0.62"><stop offset="0" stop-color="#ffe27a"/><stop offset="1" stop-color="#e0b033"/></radialGradient>
    <filter id="red-aura-soft" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <rect x="1.5" y="1.5" width="837" height="283" rx="22" fill="url(#red-aura-panel)" stroke="#d4af6a" stroke-opacity="0.28"/>
  <text x="44" y="50" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#efeaf8">How red aura differs from its neighbors</text>
  <line x1="44" y1="68" x2="796" y2="68" stroke="#d4af6a" stroke-opacity="0.18"/>
  <g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">
    <circle cx="245.0" cy="128" r="30" fill="url(#red-aura-0)" filter="url(#red-aura-soft)"/>
    <circle cx="245.0" cy="128" r="23" fill="url(#red-aura-0)"/>
    <text x="245.0" y="186" font-size="17" fill="#f3effb">Orange</text>
    <text x="245.0" y="210" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9a93b5">Creative-social,</text>
    <text x="245.0" y="226" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9a93b5">not survival drive</text>
    <circle cx="595.0" cy="128" r="30" fill="url(#red-aura-1)" filter="url(#red-aura-soft)"/>
    <circle cx="595.0" cy="128" r="23" fill="url(#red-aura-1)"/>
    <text x="595.0" y="186" font-size="17" fill="#f3effb">Yellow</text>
    <text x="595.0" y="210" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9a93b5">Identity-led, not</text>
    <text x="595.0" y="226" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9a93b5">physical impulse</text>
  </g>
  <text x="420" y="262" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#6f6890">Neighboring colors share a region of the spectrum but carry distinct mechanisms — not a ranking.</text>
</svg>
