<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 286" role="img" aria-label="Blue aura shades — and what each one signals: Light, Mid, Deep / indigo, Grey-haze">
  <defs>
    <linearGradient id="blue-aura-panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16112c"/>
      <stop offset="1" stop-color="#0b0a1b"/>
    </linearGradient>
    <radialGradient id="blue-aura-0" cx="0.5" cy="0.45" r="0.62"><stop offset="0" stop-color="#9fd0ff"/><stop offset="1" stop-color="#4a8fe0"/></radialGradient>
    <radialGradient id="blue-aura-1" cx="0.5" cy="0.45" r="0.62"><stop offset="0" stop-color="#5a9ae8"/><stop offset="1" stop-color="#2f6ec0"/></radialGradient>
    <radialGradient id="blue-aura-2" cx="0.5" cy="0.45" r="0.62"><stop offset="0" stop-color="#5a6ed0"/><stop offset="1" stop-color="#33388f"/></radialGradient>
    <radialGradient id="blue-aura-3" cx="0.5" cy="0.45" r="0.62"><stop offset="0" stop-color="#8a9ab0"/><stop offset="1" stop-color="#566074"/></radialGradient>
    <filter id="blue-aura-soft" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <rect x="1.5" y="1.5" width="837" height="283" rx="22" fill="url(#blue-aura-panel)" stroke="#d4af6a" stroke-opacity="0.28"/>
  <text x="44" y="50" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#efeaf8">Blue aura shades — and what each one signals</text>
  <line x1="44" y1="68" x2="796" y2="68" stroke="#d4af6a" stroke-opacity="0.18"/>
  <g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">
    <circle cx="157.5" cy="128" r="30" fill="url(#blue-aura-0)" filter="url(#blue-aura-soft)"/>
    <circle cx="157.5" cy="128" r="23" fill="url(#blue-aura-0)"/>
    <text x="157.5" y="186" font-size="17" fill="#f3effb">Light</text>
    <text x="157.5" y="210" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9a93b5">Gentle, sensitive expression</text>
    <text x="157.5" y="226" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9a93b5">that comforts others</text>
    <circle cx="332.5" cy="128" r="30" fill="url(#blue-aura-1)" filter="url(#blue-aura-soft)"/>
    <circle cx="332.5" cy="128" r="23" fill="url(#blue-aura-1)"/>
    <text x="332.5" y="186" font-size="17" fill="#f3effb">Mid</text>
    <text x="332.5" y="210" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9a93b5">Clear, steady, honest</text>
    <text x="332.5" y="226" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9a93b5">structured communication</text>
    <circle cx="507.5" cy="128" r="30" fill="url(#blue-aura-2)" filter="url(#blue-aura-soft)"/>
    <circle cx="507.5" cy="128" r="23" fill="url(#blue-aura-2)"/>
    <text x="507.5" y="186" font-size="17" fill="#f3effb">Deep / indigo</text>
    <text x="507.5" y="210" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9a93b5">Inward intuition and</text>
    <text x="507.5" y="226" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9a93b5">slower processing</text>
    <circle cx="682.5" cy="128" r="30" fill="url(#blue-aura-3)" filter="url(#blue-aura-soft)"/>
    <circle cx="682.5" cy="128" r="23" fill="url(#blue-aura-3)"/>
    <text x="682.5" y="186" font-size="17" fill="#f3effb">Grey-haze</text>
    <text x="682.5" y="210" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9a93b5">Words held back under</text>
    <text x="682.5" y="226" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9a93b5">stress or caution</text>
  </g>
  <text x="420" y="262" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#6f6890">Shade describes a current state, not a fixed trait — most people move across these over time.</text>
</svg>
