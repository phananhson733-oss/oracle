<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 286" role="img" aria-label="Yellow aura shades — and what each one signals: Bright / clear, Muddy / dim, Gold / metallic, Yellow-green edge">
  <defs>
    <linearGradient id="yellow-aura-panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16112c"/>
      <stop offset="1" stop-color="#0b0a1b"/>
    </linearGradient>
    <radialGradient id="yellow-aura-0" cx="0.5" cy="0.45" r="0.62"><stop offset="0" stop-color="#ffe27a"/><stop offset="1" stop-color="#e0b033"/></radialGradient>
    <radialGradient id="yellow-aura-1" cx="0.5" cy="0.45" r="0.62"><stop offset="0" stop-color="#b0a04a"/><stop offset="1" stop-color="#6e6322"/></radialGradient>
    <radialGradient id="yellow-aura-2" cx="0.5" cy="0.45" r="0.62"><stop offset="0" stop-color="#ffd95a"/><stop offset="1" stop-color="#caa12a"/></radialGradient>
    <radialGradient id="yellow-aura-3" cx="0.5" cy="0.45" r="0.62"><stop offset="0" stop-color="#cfe07a"/><stop offset="1" stop-color="#9aae3a"/></radialGradient>
    <filter id="yellow-aura-soft" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <rect x="1.5" y="1.5" width="837" height="283" rx="22" fill="url(#yellow-aura-panel)" stroke="#d4af6a" stroke-opacity="0.28"/>
  <text x="44" y="50" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#efeaf8">Yellow aura shades — and what each one signals</text>
  <line x1="44" y1="68" x2="796" y2="68" stroke="#d4af6a" stroke-opacity="0.18"/>
  <g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">
    <circle cx="157.5" cy="128" r="30" fill="url(#yellow-aura-0)" filter="url(#yellow-aura-soft)"/>
    <circle cx="157.5" cy="128" r="23" fill="url(#yellow-aura-0)"/>
    <text x="157.5" y="186" font-size="17" fill="#f3effb">Bright / clear</text>
    <text x="157.5" y="210" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9a93b5">Curiosity and confidence,</text>
    <text x="157.5" y="226" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9a93b5">well-rested and engaged</text>
    <circle cx="332.5" cy="128" r="30" fill="url(#yellow-aura-1)" filter="url(#yellow-aura-soft)"/>
    <circle cx="332.5" cy="128" r="23" fill="url(#yellow-aura-1)"/>
    <text x="332.5" y="186" font-size="17" fill="#f3effb">Muddy / dim</text>
    <text x="332.5" y="210" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9a93b5">Mental engine running</text>
    <text x="332.5" y="226" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9a93b5">past recovery</text>
    <circle cx="507.5" cy="128" r="30" fill="url(#yellow-aura-2)" filter="url(#yellow-aura-soft)"/>
    <circle cx="507.5" cy="128" r="23" fill="url(#yellow-aura-2)"/>
    <text x="507.5" y="186" font-size="17" fill="#f3effb">Gold / metallic</text>
    <text x="507.5" y="210" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9a93b5">Confidence settling into</text>
    <text x="507.5" y="226" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9a93b5">guiding others</text>
    <circle cx="682.5" cy="128" r="30" fill="url(#yellow-aura-3)" filter="url(#yellow-aura-soft)"/>
    <circle cx="682.5" cy="128" r="23" fill="url(#yellow-aura-3)"/>
    <text x="682.5" y="186" font-size="17" fill="#f3effb">Yellow-green edge</text>
    <text x="682.5" y="210" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9a93b5">Mental energy bleeding</text>
    <text x="682.5" y="226" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9a93b5">into anxiety</text>
  </g>
  <text x="420" y="262" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#6f6890">Shade describes a current state, not a fixed trait — most people move across these over time.</text>
</svg>
