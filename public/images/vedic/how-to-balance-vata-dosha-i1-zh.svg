    <text x="76" y="125.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">1</text>
  <text x="116" y="117.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">第1天 · 固定早餐</text>
  <text x="116" y="139.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">每天同一时间吃温热熟食早餐</text>
  <circle cx="76" cy="181" r="20.0" fill="url(#howtobalancevatadosha1zh-glow)" opacity="0.5"/>
    <circle cx="76" cy="181" r="15" fill="url(#howtobalancevatadosha1zh-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="176.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="185.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">2</text>
  <text x="116" y="177.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">第2天 · 换成温食</text>
  <text x="116" y="199.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">把一样生冷食物换成汤、豆糊或蒸菜</text>
  <circle cx="76" cy="241" r="20.0" fill="url(#howtobalancevatadosha1zh-glow)" opacity="0.5"/>
    <circle cx="76" cy="241" r="15" fill="url(#howtobalancevatadosha1zh-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="236.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="245.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">3</text>
  <text x="116" y="237.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">第3天 · 喝温饮</text>
  <text x="116" y="259.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">用温水或姜茶替代冰饮和气泡饮</text>
  <circle cx="76" cy="301" r="20.0" fill="url(#howtobalancevatadosha1zh-glow)" opacity="0.5"/>
    <circle cx="76" cy="301" r="15" fill="url(#howtobalancevatadosha1zh-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="296.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="305.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">4</text>
  <text x="116" y="297.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">第4天 · 减咖啡因</text>
  <text x="116" y="319.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">中午后停咖啡因，打断累却清醒的循环</text>
  <circle cx="76" cy="361" r="20.0" fill="url(#howtobalancevatadosha1zh-glow)" opacity="0.5"/>
    <circle cx="76" cy="361" r="15" fill="url(#howtobalancevatadosha1zh-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="356.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="365.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">5</text>
  <text x="116" y="357.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">第5天 · 提前入睡</text>
  <text x="116" y="379.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">晚上9:30-10点开始调暗灯光放下屏幕</text>
  <circle cx="76" cy="421" r="20.0" fill="url(#howtobalancevatadosha1zh-glow)" opacity="0.5"/>
    <circle cx="76" cy="421" r="15" fill="url(#howtobalancevatadosha1zh-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="416.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="425.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">6</text>
  <text x="116" y="417.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">第6天 · 油按摩</text>
  <text x="116" y="439.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">洗澡前做五分钟温芝麻油自我按摩</text>
  <circle cx="76" cy="481" r="20.0" fill="url(#howtobalancevatadosha1zh-glow)" opacity="0.5"/>
    <circle cx="76" cy="481" r="15" fill="url(#howtobalancevatadosha1zh-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="476.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="485.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">7</text>
  <text x="116" y="477.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">第7天 · 留住有效的</text>
  <text x="116" y="499.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">放下不合适的，留住两三个能坚持的</text>
  <path d="M 280.025 524.4 L 280.4 526.6 L 282.6 527 L 280.4 527.4 L 280.025 529.6 L 279.6 527.4 L 277.4 527 L 279.6 526.6 Z" fill="#d4af6a" opacity="0.5"/>
  <text x="380" y="531" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="11.5" fill="#7b738f">自我反思框架，描述倾向而非预测</text>
