    <text x="76" y="185.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">2</text>
  <text x="116" y="177.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">Food response</text>
  <text x="116" y="199.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">Light fresh food keeps clarity; rich food deepens tamas</text>
  <circle cx="76" cy="241" r="20.0" fill="url(#sattvarajastamas0en-glow)" opacity="0.5"/>
    <circle cx="76" cy="241" r="15" fill="url(#sattvarajastamas0en-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="236.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="245.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">3</text>
  <text x="116" y="237.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">Decision tempo</text>
  <text x="116" y="259.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">Unhurried: sattva; fast then revised: rajas; deferred: tamas</text>
  <circle cx="76" cy="301" r="20.0" fill="url(#sattvarajastamas0en-glow)" opacity="0.5"/>
    <circle cx="76" cy="301" r="15" fill="url(#sattvarajastamas0en-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="296.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="305.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">4</text>
  <text x="116" y="297.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">Breath quality</text>
  <text x="116" y="319.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">Even and slow: sattva; shallow, rapid: rajas; labored: tamas</text>
  <circle cx="76" cy="361" r="20.0" fill="url(#sattvarajastamas0en-glow)" opacity="0.5"/>
    <circle cx="76" cy="361" r="15" fill="url(#sattvarajastamas0en-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
