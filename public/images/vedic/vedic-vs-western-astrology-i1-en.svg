  <text x="116" y="297.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">Watch the house emphasis</text>
  <text x="116" y="319.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">Whole-sign houses and the lagna reorganize life areas</text>
  <circle cx="76" cy="361" r="20.0" fill="url(#vedicvswesternastrology1en-glow)" opacity="0.5"/>
    <circle cx="76" cy="361" r="15" fill="url(#vedicvswesternastrology1en-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
