    <text x="76" y="125.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">1</text>
  <text x="116" y="117.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">Day 1 · Fix breakfast</text>
  <text x="116" y="139.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">A warm, cooked breakfast at the same time each morning</text>
  <circle cx="76" cy="181" r="20.0" fill="url(#howtobalancevatadosha1en-glow)" opacity="0.5"/>
    <circle cx="76" cy="181" r="15" fill="url(#howtobalancevatadosha1en-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="176.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="185.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">2</text>
  <text x="116" y="177.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">Day 2 · Warm it up</text>
  <text x="116" y="199.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">Swap one cold or raw item for soup, dal, or steamed food</text>
  <circle cx="76" cy="241" r="20.0" fill="url(#howtobalancevatadosha1en-glow)" opacity="0.5"/>
    <circle cx="76" cy="241" r="15" fill="url(#howtobalancevatadosha1en-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="236.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="245.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">3</text>
  <text x="116" y="237.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">Day 3 · Sip warm</text>
  <text x="116" y="259.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">Warm water or ginger tea instead of iced, fizzy drinks</text>
  <circle cx="76" cy="301" r="20.0" fill="url(#howtobalancevatadosha1en-glow)" opacity="0.5"/>
    <circle cx="76" cy="301" r="15" fill="url(#howtobalancevatadosha1en-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="296.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="305.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">4</text>
  <text x="116" y="297.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">Day 4 · Ease the caffeine</text>
  <text x="116" y="319.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">No caffeine after noon to break the wired-tired loop</text>
  <circle cx="76" cy="361" r="20.0" fill="url(#howtobalancevatadosha1en-glow)" opacity="0.5"/>
    <circle cx="76" cy="361" r="15" fill="url(#howtobalancevatadosha1en-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="356.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="365.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">5</text>
  <text x="116" y="357.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">Day 5 · Earlier window</text>
  <text x="116" y="379.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">Wind down by 9:30-10 p.m. with screens and lights low</text>
  <circle cx="76" cy="421" r="20.0" fill="url(#howtobalancevatadosha1en-glow)" opacity="0.5"/>
    <circle cx="76" cy="421" r="15" fill="url(#howtobalancevatadosha1en-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="416.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="425.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">6</text>
  <text x="116" y="417.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">Day 6 · Oil massage</text>
  <text x="116" y="439.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">Five minutes of warm sesame-oil abhyanga before a shower</text>
  <circle cx="76" cy="481" r="20.0" fill="url(#howtobalancevatadosha1en-glow)" opacity="0.5"/>
    <circle cx="76" cy="481" r="15" fill="url(#howtobalancevatadosha1en-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="476.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="485.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">7</text>
  <text x="116" y="477.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">Day 7 · Keep what stuck</text>
  <text x="116" y="499.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">Drop what didn't fit; hold the two or three that did</text>
