  <text x="116" y="297.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">Releases are listed</text>
  <text x="116" y="319.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">Habits, expectations, self-narratives that won't serve next</text>
  <circle cx="76" cy="361" r="20.0" fill="url(#moonjournal1en-glow)" opacity="0.5"/>
    <circle cx="76" cy="361" r="15" fill="url(#moonjournal1en-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="356.8" r="9.0" fill="#ffffff" opacity="0.10"/>
