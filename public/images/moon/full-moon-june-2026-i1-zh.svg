    <text x="76" y="305.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">4</text>
  <text x="116" y="297.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">被情感根基牵引</text>
  <text x="116" y="319.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">意外地想靠近家人、家庭与个人慰藉</text>
  <circle cx="76" cy="361" r="20.0" fill="url(#fullmoonjune20261zh-glow)" opacity="0.5"/>
    <circle cx="76" cy="361" r="15" fill="url(#fullmoonjune20261zh-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
