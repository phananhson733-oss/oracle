  <text x="116" y="177.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">事业倦怠感</text>
  <text x="116" y="199.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">对长期维持的职业结构悄然生疑</text>
  <circle cx="76" cy="241" r="20.0" fill="url(#fullmoonjune20261zh-glow)" opacity="0.5"/>
