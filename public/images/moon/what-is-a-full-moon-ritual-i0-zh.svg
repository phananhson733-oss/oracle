    <text x="76" y="305.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">4</text>
  <text x="116" y="297.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">48小时内改变一个行为</text>
  <text x="116" y="319.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">晚回一条消息、婉拒一次邀约、一个不同的选择</text>
  <circle cx="76" cy="361" r="20.0" fill="url(#whatisafullmoonritual0zh-glow)" opacity="0.5"/>
