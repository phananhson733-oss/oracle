    <text x="76" y="125.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">1</text>
  <text x="116" y="117.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">抗拒下笔</text>
  <text x="116" y="139.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">想跳过或软化某个问题，正指向核心素材</text>
  <circle cx="76" cy="181" r="20.0" fill="url(#shadowworkjournalprompts1zh-glow)" opacity="0.5"/>
