  <text x="116" y="177.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">Heightened sensitivity</text>
  <text x="116" y="199.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">Stronger reactions, vivid dreams, a restless edge</text>
  <circle cx="76" cy="241" r="20.0" fill="url(#whattodoonafullmoonspiritually1en-glow)" opacity="0.5"/>
    <circle cx="76" cy="241" r="15" fill="url(#whattodoonafullmoonspiritually1en-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="236.8" r="9.0" fill="#ffffff" opacity="0.10"/>
    <text x="76" y="245.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3a2c12">3</text>
  <text x="116" y="237.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.3" fill="#f3effb">Clarity on what's finished</text>
  <text x="116" y="259.0" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#a59cc0">A habit, commitment, or worry you've quietly outgrown</text>
  <circle cx="76" cy="301" r="20.0" fill="url(#whattodoonafullmoonspiritually1en-glow)" opacity="0.5"/>
    <circle cx="76" cy="301" r="15" fill="url(#whattodoonafullmoonspiritually1en-foil)" stroke="#f6e6bf" stroke-opacity="0.5" stroke-width="0.8"/>
    <circle cx="76" cy="296.8" r="9.0" fill="#ffffff" opacity="0.10"/>
