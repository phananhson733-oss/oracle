<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PayPal 积分充值测试</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
      background: #f5f5f5;
    }
    .container {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h1 {
      color: #333;
      margin-bottom: 10px;
    }
    .subtitle {
      color: #666;
      margin-bottom: 30px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: #333;
    }
    input, select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 14px;
      background: #0070ba;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #005a95;
    }
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    .result {
      margin-top: 30px;
      padding: 20px;
      border-radius: 8px;
      display: none;
    }
    .result.success {
      background: #e6f7e6;
      border: 1px solid #4caf50;
      display: block;
    }
    .result.error {
      background: #ffe6e6;
      border: 1px solid #f44336;
      display: block;
    }
    .result h3 {
      margin-top: 0;
      margin-bottom: 15px;
    }
    .result pre {
      background: rgba(0,0,0,0.05);
      padding: 12px;
      border-radius: 4px;
      overflow-x: auto;
      font-size: 13px;
      line-height: 1.5;
    }
    .url-check {
      margin-top: 15px;
      padding: 12px;
      border-radius: 6px;
      font-weight: 600;
    }
    .url-check.sandbox {
      background: #4caf50;
      color: white;
    }
    .url-check.live {
      background: #f44336;
      color: white;
    }
    .spinner {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #0070ba;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      animation: spin 1s linear infinite;
      display: inline-block;
      margin-right: 10px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🧪 PayPal 积分充值测试</h1>
    <p class="subtitle">此页面直接调用后端 API，绕过前端缓存，用于诊断问题</p>

    <div class="form-group">
      <label>JWT Token（从 LocalStorage 获取）</label>
      <input type="text" id="token" placeholder="从浏览器 Application > Local Storage > accessToken 复制">
      <button onclick="getTokenFromStorage()" style="margin-top: 8px; width: auto; padding: 8px 16px; font-size: 14px;">从 LocalStorage 自动填充</button>
    </div>

    <div class="form-group">
      <label>选择积分套餐</label>
      <select id="package">
        <option value="credits_100">100 积分 - $9.99</option>
        <option value="credits_300" selected>300 积分 - $24.99</option>
        <option value="credits_500">500 积分 - $39.99</option>
        <option value="credits_1000">1000 积分 - $69.99</option>
      </select>
    </div>

    <button id="testBtn" onclick="testPayPal()">
      <span id="btnText">创建 PayPal 订单并检查 URL</span>
    </button>

    <div id="result" class="result"></div>
  </div>

  <script>
    const API_BASE = 'http://localhost:3001/api';

    function getTokenFromStorage() {
      try {
        const token = localStorage.getItem('accessToken');
        if (token) {
          document.getElementById('token').value = token;
          alert('✅ Token 已自动填充');
        } else {
          alert('❌ 未找到 accessToken\n\n请先在主应用中登录，然后刷新此页面再试。');
        }
      } catch (err) {
        alert('❌ 无法访问 LocalStorage: ' + err.message);
      }
    }

    async function testPayPal() {
      const token = document.getElementById('token').value.trim();
      const packageId = document.getElementById('package').value;
      const resultDiv = document.getElementById('result');
      const btn = document.getElementById('testBtn');
      const btnText = document.getElementById('btnText');

      if (!token) {
        alert('请先填写 JWT Token');
        return;
      }

      // 禁用按钮
      btn.disabled = true;
      btnText.innerHTML = '<span class="spinner"></span>请求中...';
      resultDiv.className = 'result';
      resultDiv.style.display = 'none';

      try {
        const response = await fetch(`${API_BASE}/paypal/create-order`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`,
          },
          body: JSON.stringify({
            packageId: packageId,
            successUrl: 'https://example.com/success',
            cancelUrl: 'https://example.com/cancel',
          }),
        });

        const data = await response.json();

        if (response.ok && data.approvalUrl) {
          const url = data.approvalUrl;
          const isSandbox = url.includes('sandbox.paypal.com');
          const isLive = url.includes('www.paypal.com') && !url.includes('sandbox');

          resultDiv.className = 'result success';
          resultDiv.innerHTML = `
            <h3>✅ 订单创建成功</h3>
            <div><strong>订单 ID:</strong> ${data.orderId}</div>
            <div style="margin-top: 10px;"><strong>跳转 URL:</strong></div>
            <pre>${url}</pre>
            <div class="url-check ${isSandbox ? 'sandbox' : 'live'}">
              ${isSandbox
                ? '✅ 正确：跳转到 Sandbox 环境 (sandbox.paypal.com)'
                : '❌ 错误：跳转到 Live 生产环境 (www.paypal.com)'}
            </div>
            ${isSandbox
              ? '<p style="margin-top: 15px; color: #4caf50;">🎉 配置正确！可以点击下方按钮跳转到 PayPal 测试。</p>'
              : '<p style="margin-top: 15px; color: #f44336;">⚠️ 后端仍在使用 Live 凭证或配置错误。请检查 backend/.env.local 配置。</p>'}
            <button onclick="window.open('${url}', '_blank')" style="margin-top: 15px; width: auto; padding: 12px 24px;">
              打开 PayPal 支付页面
            </button>
          `;
        } else {
          resultDiv.className = 'result error';
          resultDiv.innerHTML = `
            <h3>❌ 订单创建失败</h3>
            <div><strong>状态码:</strong> ${response.status}</div>
            <div style="margin-top: 10px;"><strong>错误信息:</strong></div>
            <pre>${JSON.stringify(data, null, 2)}</pre>
            ${response.status === 401
              ? '<p style="color: #f44336; margin-top: 15px;">💡 提示：Token 可能无效或已过期，请重新登录应用并获取新 Token。</p>'
              : ''}
          `;
        }
      } catch (err) {
        resultDiv.className = 'result error';
        resultDiv.innerHTML = `
          <h3>❌ 请求异常</h3>
          <div><strong>错误:</strong> ${err.message}</div>
          <p style="color: #f44336; margin-top: 15px;">
            💡 提示：请确认后端服务正在运行（http://localhost:3001）
          </p>
        `;
      } finally {
        btn.disabled = false;
        btnText.textContent = '创建 PayPal 订单并检查 URL';
      }
    }

    // 页面加载时自动尝试获取 token
    window.addEventListener('DOMContentLoaded', () => {
      getTokenFromStorage();
    });
  </script>
</body>
</html>
